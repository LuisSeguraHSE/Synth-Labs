<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../shared/style.css"></head>
<body><div id="app"></div>
<script src="../../shared/controls.js"></script>
<script src="../../shared/sim.js"></script>
<script src="../../shared/gfx.js"></script>
<script>
// Tanque (integrador): dh/dt = (u·Qmax − demanda)/A. PID con anti-windup. Unidad: segundos.
const A = 2, HMAX = 4, QMAX = 50; // m², m, L/s
SL.app({
  title: 'Agua · Control de nivel PID',
  desc: 'Sintoniza Kp/Ki/Kd. La demanda cambia en escalón cada 120 s: observa sobreimpulso, error y esfuerzo de la bomba.',
  unit: 's', dt: 0.1, sample: 1,
  params: [
    { id: 'sp', label: 'Setpoint de nivel', min: 0.5, max: 3.5, step: 0.1, value: 2, unit: 'm' },
    { id: 'kp', label: 'Kp', min: 0, max: 6, step: 0.1, value: 1.5 },
    { id: 'ki', label: 'Ki', min: 0, max: 0.5, step: 0.01, value: 0.05 },
    { id: 'kd', label: 'Kd', min: 0, max: 10, step: 0.5, value: 0 },
    { id: 'dem', label: 'Demanda base', min: 0, max: 40, step: 1, value: 20, unit: 'L/s' },
    { id: 'step', label: 'Escalón de demanda', min: 0, max: 20, step: 1, value: 10, unit: 'L/s' },
  ],
  init(p) { return { h: 1, i: 0, e0: p.sp - 1, u: 0, iae: 0, maxh: 1, q: p.dem }; },
  step(s, dt, p, r) {
    s.q = p.dem + (Math.floor((s.t || 0) / 120) % 2 ? p.step : 0);
    const e = p.sp - s.h, d = (e - s.e0) / dt;
    const raw = p.kp * e + p.ki * s.i + p.kd * d;
    s.u = SL.clamp(raw, 0, 1);
    if (raw === s.u) s.i += e * dt; // anti-windup por condicionamiento
    s.e0 = e;
    s.h = SL.clamp(s.h + ((s.u * QMAX - s.q) / 1000 / A) * dt, 0, HMAX);
    s.iae += Math.abs(e) * dt; s.maxh = Math.max(s.maxh, s.h);
  },
  draw(g, s, p, W, H) {
    const x = 330, y = 64, w = 160, h = 290, py = (v) => y + h - (v / HMAX) * h, u = s.u || 0, t = s.t || 0;
    // Reservorio, bomba y línea de impulsión
    g.fillStyle = SL.vgrad(g, 392, 40, '#1f5f8f', '#123a58'); g.fillRect(30, 392, 180, 38); g.fillStyle = 'rgba(191,230,255,.25)'; g.fillRect(30, 392, 180, 3);
    SL.text(g, 'Reservorio', 120, 446, '#8b9bb0', '11px system-ui', 'center');
    SL.pipe(g, [[96, 400], [96, 344]], 8);
    SL.pipe(g, [[122, 318], [122, 36], [410, 36], [410, y - 8]], 9);
    SL.flow(g, 122, 300, 122, 50, Math.round(u * 5), '#9fe3ff'); SL.flow(g, 132, 36, 400, 36, Math.round(u * 5), '#9fe3ff');
    SL.pump(g, 110, 336, 24, u > 0.02, t * u * 10);
    SL.tag(g, `P-101 · ${(100 * u).toFixed(0)} %`, 150, 292, u > 0.02 ? SL.STATE.run : SL.STATE.idle);
    // Tanque con nivel, setpoint y PV
    SL.tank(g, x, y, w, h, s.h / HMAX, { max: HMAX, ticks: 8 });
    g.strokeStyle = '#f5b942'; g.setLineDash([8, 5]); g.lineWidth = 1.5; g.beginPath(); g.moveTo(x - 16, py(p.sp)); g.lineTo(x + w + 16, py(p.sp)); g.stroke(); g.setLineDash([]);
    SL.tag(g, `SP ${p.sp.toFixed(1)} m`, x + w + 52, py(p.sp), '#f5b942');
    SL.tag(g, `PV ${s.h.toFixed(2)} m`, x + w / 2, Math.max(y + 16, py(s.h) - 14), '#9fe3ff');
    // Descarga con válvula y demanda
    const oy = y + h - 16;
    SL.pipe(g, [[x + w, oy], [770, oy]], 9);
    SL.flow(g, x + w + 12, oy, 760, oy, Math.round(s.q / 8), '#9fe3ff');
    const vx = 650; g.fillStyle = '#c3ccd6'; g.beginPath(); g.moveTo(vx - 10, oy - 8); g.lineTo(vx + 10, oy + 8); g.lineTo(vx + 10, oy - 8); g.lineTo(vx - 10, oy + 8); g.closePath(); g.fill();
    g.fillStyle = '#5b6b80'; g.fillRect(vx - 1.5, oy - 22, 3, 14); g.fillRect(vx - 9, oy - 25, 18, 3);
    SL.tag(g, `Demanda ${s.q.toFixed(0)} L/s`, 700, oy + 26, SL.STATE.down);
    // Instrumentación ISA: transmisor de nivel y controlador
    const bubble = (bx, by, a, b) => { g.fillStyle = '#0b1117'; g.beginPath(); g.arc(bx, by, 18, 0, 7); g.fill(); g.strokeStyle = '#9fe3ff'; g.lineWidth = 1.5; g.stroke(); g.beginPath(); g.moveTo(bx - 18, by); g.lineTo(bx + 18, by); g.stroke(); SL.text(g, a, bx, by - 4, '#e6edf3', '600 10px system-ui', 'center'); SL.text(g, b, bx, by + 12, '#e6edf3', '10px system-ui', 'center'); };
    g.setLineDash([4, 4]); g.strokeStyle = 'rgba(159,227,255,.55)'; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(x + w, y + 230); g.lineTo(540, y + 230); g.lineTo(600, 130); g.stroke();
    g.beginPath(); g.moveTo(600, 112); g.lineTo(600, 16); g.lineTo(180, 16); g.lineTo(180, 318); g.stroke();
    g.setLineDash([]);
    bubble(540, y + 230, 'LT', '101'); bubble(600, 130, 'LIC', '101');
    SL.tag(g, `u = ${(100 * u).toFixed(0)} %`, 660, 130, SL.STATE.info);
  },
  kpis(s, p) {
    return [
      { label: 'Nivel (PV)', value: s.h.toFixed(2) + ' m' },
      { label: 'Error actual', value: (p.sp - s.h).toFixed(3) + ' m' },
      { label: 'Salida bomba', value: (100 * s.u).toFixed(0) + ' %' },
      { label: 'IAE acumulado', value: s.iae.toFixed(1) },
      { label: 'Nivel máximo', value: s.maxh.toFixed(2) + ' m' },
      { label: 'Demanda', value: s.q.toFixed(0) + ' L/s' },
    ];
  },
  series: (s, p) => ({ Nivel: s.h, Setpoint: p.sp, 'Bomba %': 100 * s.u, 'Demanda L/s': s.q }),
});
</script></body></html>
