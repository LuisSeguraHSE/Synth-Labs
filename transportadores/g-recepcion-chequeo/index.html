<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../shared/style.css"></head>
<body><div id="app"></div>
<script src="../../shared/controls.js"></script>
<script src="../../shared/sim.js"></script>
<script src="../../shared/gfx.js"></script>
<script>
// Recepción y chequeo. Unidad: segundos. Camiones → descarga → conteo/foto/sello → ok / no conforme → slot.
SL.app({
  title: 'Demo G · Recepción y chequeo',
  desc: 'El inventario no se pierde en el rack; se pierde en la rampa. "Hoy": el camión espera en muelle hasta que se recuenta en piso. "Propuesto": descarga a banda, puesto de control y desvío ok / no ok.',
  pitch: '"El inventario no se pierde en el rack; se pierde en la rampa."',
  obj: '"Es un ticket chico." → Sí: decide el jefe de almacén; útil para PRODISA, droguerías, 3PL y mayoristas. Decisión del jefe de almacén: útil para droguerías, 3PL y mayoristas. Módulo de 6–10 m + puesto + desviador binario.',
  unit: 's', dt: 0.5, sample: 30, speeds: [1, 10, 60, 240],
  params: [
    { id: 'mode', label: 'Escenario', opts: ['Hoy: descarga a piso + 3 recuentan', 'Propuesto: banda + puesto de control'], value: 0 },
    { id: 'gap', label: 'Un camión cada', min: 6, max: 40, step: 1, value: 10, unit: 'min' },
    { id: 'nb', label: 'Bultos por camión', min: 60, max: 240, step: 10, value: 120 },
    { id: 'tu', label: 'Descarga', min: 2, max: 8, step: 0.5, value: 4, unit: 's/bulto' },
    { id: 'nc', label: 'Bultos no conformes', min: 0, max: 10, step: 0.5, value: 4, unit: '%' },
  ],
  init() { return { trucks: [{ at: 0, n: 0, left: 120, id: 1 }], nextT: 600, id: 1, dock: null, patio: [], buf: [], ctl: [], ok: 0, nc: 0, miss: 0, tdock: 0, nleave: 0, twait: 0, nw: 0, un: 0, checked: 0 }; },
  step(s, dt, p, r) {
    const hoy = p.mode === 0, cap = hoy ? 25 : 12, nsrv = hoy ? 3 : 1, tc = hoy ? 14 : 3.6, det = hoy ? 0.72 : 0.96;
    if (s.t >= s.nextT) { s.id++; s.patio.push({ at: s.t, left: p.nb, id: s.id, nb: p.nb, chk: 0 }); s.nextT += p.gap * 60; }
    if (s.trucks.length) { s.patio.push(Object.assign(s.trucks.pop(), { at: 0, left: p.nb, nb: p.nb, chk: 0 })); }
    if (!s.dock && s.patio.length) { s.dock = s.patio.shift(); s.dock.t0 = s.t; s.twait += s.t - s.dock.at; s.nw++; s.dock.un = 0; s.dock.nextU = s.t; }
    const d = s.dock;
    if (d && d.left > 0 && s.buf.length < cap && s.t >= d.nextU) { d.left--; d.un++; d.nextU = s.t + p.tu * (0.9 + 0.2 * r()); s.buf.push({ bad: r() < p.nc / 100, tr: d }); s.un++; }
    for (let i = 0; i < nsrv; i++) {
      const c = s.ctl[i] || (s.ctl[i] = { rem: 0, b: null });
      if (c.b && (c.rem -= dt) <= 0) {
        const b = c.b; c.b = null; b.tr.chk++; s.checked++;
        if (b.bad) { if (r() < det) s.nc++; else s.miss++; } else s.ok++;
      }
      if (!c.b && s.buf.length) { c.b = s.buf.shift(); c.rem = tc * (0.85 + 0.3 * r()); }
    }
    if (d) {
      const fin = hoy ? d.chk >= d.nb : d.left <= 0;
      if (fin) { s.tdock += s.t - d.t0; s.nleave++; s.dock = null; }
    }
  },
  draw(g, s, p, W, H) {
    const hoy = p.mode === 0, y = 190, fy = y + 44;
    g.fillStyle = '#2a3440'; g.fillRect(10, fy, 150, 8); SL.text(g, 'MUELLE', 84, fy + 22, '#8b9bb0', '11px system-ui', 'center');
    if (s.dock) { SL.van(g, 100, fy, { s: 1.4, dir: -1, open: true }); SL.tag(g, `Camión #${s.dock.id} · ${s.dock.left} por bajar`, 84, y - 46, SL.STATE.info); }
    SL.text(g, `Patio: ${s.patio.length} camión(es) esperando`, 14, 330, s.patio.length ? '#ef5350' : '#3ecf8e', '600 12px system-ui');
    for (let i = 0; i < Math.min(s.patio.length, 3); i++) SL.van(g, 70 + i * 90, 400, { s: 0.8, dir: -1, body: '#c9d1d9', cab: '#5b6b80' });
    const box = (x, yy, bad) => SL.carton(g, x, yy, 16, 13, bad ? '#d4a33a' : '#b98a58');
    if (hoy) {
      g.fillStyle = 'rgba(239,83,80,.05)'; g.fillRect(168, y - 70, 250, 120); g.strokeStyle = 'rgba(239,83,80,.35)'; g.setLineDash([6, 4]); g.strokeRect(168.5, y - 69.5, 249, 119); g.setLineDash([]);
      SL.text(g, 'Bultos en piso (recuento manual)', 172, y - 78, '#ef5350', '600 12px system-ui');
      s.buf.forEach((b, i) => box(176 + (i % 13) * 18, y - 60 + Math.floor(i / 13) * 16, b.bad));
      [0, 1, 2].forEach((i) => { const c = s.ctl[i]; SL.person(g, 440 + i * 36, fy, { dir: -1, busy: !!(c && c.b), carry: c && c.b ? '#b98a58' : null }); SL.led(g, 440 + i * 36, y - 10, 2.4, c && c.b ? SL.STATE.run : SL.STATE.idle, !!(c && c.b)); });
    } else {
      SL.belt(g, [[150, y], [452, y]], 22);
      s.buf.forEach((b, i) => box(420 - i * 24, y - 7, b.bad));
      SL.machine(g, 452, y - 58, 84, 74, { label: 'Control', sub: 'conteo·foto', state: s.ctl[0] && s.ctl[0].b ? 'run' : 'idle', fs: 12 });
      SL.person(g, 494, fy + 14, { dir: -1, busy: !!(s.ctl[0] && s.ctl[0].b) });
      SL.person(g, 150, fy, { dir: 1, busy: !!s.dock });
    }
    SL.belt(g, [[536, y], [600, y], [600, y - 76]], 16); SL.belt(g, [[600, y], [600, y + 76]], 16);
    g.fillStyle = '#f5b942'; g.fillRect(596, y - 4, 8, 8); SL.text(g, 'desvío', 612, y + 4, '#8b9bb0', '10px system-ui');
    SL.shelf(g, 626, y - 150, 160, 70, 3, Math.min(1, s.ok / 300), 3); SL.tag(g, `Slot / picking: ${s.ok}`, 706, y - 162, SL.STATE.run);
    g.strokeStyle = '#ef5350'; g.lineWidth = 1.5; g.strokeRect(630.5, y + 70.5, 150, 70); g.fillStyle = 'rgba(239,83,80,.06)'; g.fillRect(631, y + 71, 149, 69);
    for (let i = 0; i < Math.min(s.nc, 20); i++) box(638 + (i % 8) * 17, y + 120 - Math.floor(i / 8) * 14, true);
    SL.tag(g, `No conforme: ${s.nc}`, 706, y + 156, SL.STATE.down);
  },
  kpis(s, p) {
    const hrs = Math.max(s.t, 1) / 3600;
    return [
      { label: 'Bultos chequeados/h', value: (s.checked / hrs).toFixed(0) },
      { label: 'Tiempo de camión en muelle', value: s.nleave ? (s.tdock / s.nleave / 60).toFixed(1) + ' min' : '—' },
      { label: 'Espera en patio', value: s.nw ? (s.twait / s.nw / 60).toFixed(1) + ' min' : '—' },
      { label: 'No conformes detectados', value: s.nc },
      { label: 'Diferencias de inventario', value: s.miss },
      { label: 'Personas en recuento', value: p.mode === 0 ? 3 : 1 },
      { label: 'Camiones despachados', value: s.nleave },
    ];
  },
  series: (s) => ({ 'Camiones en patio': s.patio.length, 'Bultos por chequear': s.buf.length, 'Diferencias': s.miss }),
});
</script></body></html>
