<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../shared/style.css"></head>
<body><div id="app"></div>
<script src="../../shared/controls.js"></script>
<script src="../../shared/sim.js"></script>
<script src="../../shared/gfx.js"></script>
<script>
// Clasificador compacto con recirculación. Unidad: segundos. Lazo de 30 m; desviadores en bordes superior/inferior.
const DN = ['Lima', 'Norte', 'Sur', 'Aéreo', 'Sierra', 'Selva'], WT = [0.4, 0.22, 0.2, 0.1, 0.05, 0.03], LM = 30, DS = [3, 6, 9, 18, 21, 24], RJ = 27.5;
const LOOP = [[100, 100], [700, 100], [700, 300], [100, 300], [100, 100]], LL = SL.len(LOOP), TY = [['bolsa', 0.5], ['caja', 0.7], ['irregular', 1.2]];
const at = (s) => SL.along(LOOP, ((s % LM) / LM) * LL);
SL.app({
  title: 'Demo E · Clasificador chico (4–6 destinos)',
  desc: 'Inducción → lectura → desviadores → chutes, con recirculación cuando el chute está lleno. Mix de bolsas, cajas e irregulares. Baja el volumen para ver el punto de equilibrio.',
  pitch: '"No es el sorter de 150 mil unidades. Es el de 1.500–4.000 bultos/hora que les quita la fila de las 6 pm."',
  obj: '"Muy caro para el volumen." → Revisa el KPI de payback: a X bultos/día la banda se paga; debajo, no insistas.',
  unit: 's', dt: 0.1, sample: 10, speeds: [1, 5, 20, 60],
  params: [
    { id: 'mode', label: 'Escenario', opts: ['Hoy: 6 personas clasificando', 'Propuesto: clasificador + 2 personas'], value: 1 },
    { id: 'nd', label: 'Destinos con chute', min: 4, max: 6, step: 1, value: 4, reset: true },
    { id: 'rate', label: 'Volumen de bultos', min: 300, max: 4000, step: 100, value: 2000, unit: '/h' },
    { id: 'v', label: 'Velocidad de banda', min: 0.6, max: 1.4, step: 0.1, value: 0.9, unit: 'm/s' },
    { id: 'cap', label: 'Capacidad de chute', min: 6, max: 40, step: 2, value: 16, unit: 'bultos' },
    { id: 'drain', label: 'Retiro del chute', min: 2, max: 12, step: 0.5, value: 3.5, unit: 's/bulto' },
    { id: 'inv', label: 'Inversión del sistema', min: 30, max: 250, step: 10, value: 90, unit: 'k USD' },
    { id: 'sal', label: 'Costo mensual por persona', min: 500, max: 1800, step: 50, value: 900, unit: 'USD' },
  ],
  init(p) { return { it: [], q: 0, ch: Array.from({ length: 6 }, () => ({ n: 0, tm: 0, got: 0 })), man: Array.from({ length: 6 }, () => ({ rem: 0, it: null })), out: 0, ok: 0, bad: 0, rec: 0, rej: 0, inq: 0, nextIn: 0 }; },
  step(s, dt, p, r) {
    const hoy = p.mode === 0, nd = p.nd, w = WT.slice(0, nd), sw = w.reduce((a, b) => a + b, 0);
    if (r() < (p.rate / 3600) * dt) { const u = r(), ty = u < 0.45 ? 0 : u < 0.85 ? 1 : 2; let d = 0, a = r() * sw; while (a > w[d] && d < nd - 1) a -= w[d++]; s.q++; s.inq = (s.inq || 0); s.pend = (s.pend || []); s.pend.push({ ty, d }); }
    s.pend = s.pend || [];
    s.ch.forEach((c, i) => { if (c.n > 0 && (c.tm += dt) >= p.drain) { c.n--; c.tm = 0; } });
    if (hoy) {
      for (let i = 0; i < 6; i++) {
        const k = s.man[i];
        if (k.it && (k.rem -= dt) <= 0) { s.out++; if (r() < 0.03) s.bad++; else s.ok++; k.it = null; }
        if (!k.it && s.pend.length) { k.it = s.pend.shift(); s.q--; k.rem = (3600 / 250) * (0.8 + 0.4 * r()) * (1 + 0.15 * TY[k.it.ty][1]); }
      }
      return;
    }
    const v = p.v;
    for (const a of s.it) {
      const prev = a.s; a.s += v * dt; a.age += dt;
      if (Math.floor(a.s / LM) > Math.floor(prev / LM)) { a.lap++; if (a.lap > 3 && !a.rj) a.rj = true; }
      const pos = a.s % LM, pp = prev % LM;
      if (!a.done && !a.rj && pos >= DS[a.d] && (pp < DS[a.d] || pp > pos)) {
        if (s.ch[a.d].n < p.cap) { s.ch[a.d].n++; a.done = true; s.out++; if (r() < 0.004) s.bad++; else s.ok++; if (a.lap > 0) s.rec++; }
        else a.miss = true;
      }
      if (!a.done && a.rj && pos >= RJ && (pp < RJ || pp > pos)) { a.done = true; s.rej++; }
    }
    s.it = s.it.filter((a) => !a.done);
    if (s.pend.length) {
      const c = TY[s.pend[0].ty][1] + 0.3;
      if (!s.it.some((a) => { const x = a.s % LM; return x < c || x > LM - c; })) { const it = s.pend.shift(); s.q--; s.it.push({ s: 0, d: it.d, ty: it.ty, lap: 0, age: 0, rj: r() < 0.03, done: false }); }
    }
  },
  draw(g, s, p, W, H) {
    const hoy = p.mode === 0;
    const parcel = (x, y, ty, a) => {
      g.save();
      if (a.rj || a.lap > 0) { g.strokeStyle = a.rj ? '#ef5350' : '#ba68c8'; g.lineWidth = 2.5; g.beginPath(); g.arc(x, y, 12, 0, 7); g.stroke(); }
      if (ty === 0) { g.fillStyle = SL.vgrad(g, y - 7, 14, '#8fd0f5', '#3a8fc4'); g.beginPath(); g.ellipse(x, y, 8, 6, 0.2, 0, 7); g.fill(); g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(x - 5, y - 5, 4, 2); }
      else if (ty === 1) SL.carton(g, x - 8, y - 6, 16, 12, '#c59b6d');
      else { g.fillStyle = SL.vgrad(g, y - 8, 16, '#f5d27a', '#c99a2e'); g.beginPath(); g.moveTo(x - 11, y + 2); g.lineTo(x - 4, y - 8); g.lineTo(x + 10, y - 5); g.lineTo(x + 11, y + 6); g.lineTo(x - 6, y + 8); g.closePath(); g.fill(); }
      g.restore();
    };
    if (hoy) {
      SL.text(g, 'Cola de bultos en el piso: ' + s.q, 40, 40, '#ef5350', '600 14px system-ui');
      for (let i = 0; i < Math.min(s.q, 160); i++) parcel(48 + (i % 40) * 17 + ((i * 7) % 5), 62 + Math.floor(i / 40) * 17 + ((i * 3) % 4), i % 3, {});
      s.man.forEach((k, i) => { const x = 90 + i * 112; SL.person(g, x, 290, { dir: i % 2 ? -1 : 1, busy: !!k.it, carry: k.it ? '#c59b6d' : null, walk: k.it ? s.t * 8 + i : 0 }); SL.led(g, x, 244, 2.6, k.it ? SL.STATE.run : SL.STATE.idle, !!k.it); SL.text(g, 'P' + (i + 1), x, 308, '#8b9bb0', '11px system-ui', 'center'); });
      DN.slice(0, p.nd).forEach((n, k) => SL.chute(g, 40 + k * 124, 330, 104, 64, s.ch[k].n / p.cap, '#3ecf8e', `${n} ${s.ch[k].n}`));
      SL.text(g, '6 personas llevan cada bulto a su destino (error ~3 %, sin recirculación)', 40, 432, '#8b9bb0');
      return;
    }
    SL.belt(g, LOOP, 22);
    const rd = at(1); // arco de lectura
    g.fillStyle = '#26313d'; g.fillRect(rd.x - 3, rd.y - 28, 6, 56); g.fillRect(rd.x - 3, rd.y - 30, 24, 5); SL.led(g, rd.x + 18, rd.y - 27, 2.4, SL.STATE.info);
    g.strokeStyle = 'rgba(79,195,247,.45)'; g.beginPath(); g.moveTo(rd.x + 18, rd.y - 24); g.lineTo(rd.x + 6, rd.y + 10); g.lineTo(rd.x + 30, rd.y + 10); g.closePath(); g.stroke();
    for (let k = 0; k < p.nd; k++) {
      const q = at(DS[k]), top = DS[k] < 15, y0 = top ? 100 : 300, sg = top ? -1 : 1, full = s.ch[k].n >= p.cap;
      g.save(); g.translate(q.x, y0); g.rotate(-sg * 0.7); g.fillStyle = full ? '#8b9bb0' : '#f5b942'; g.fillRect(-2.5, 0, 5, sg * 24); g.restore(); // desviador
      SL.chute(g, q.x - 46, top ? y0 - 94 : y0 + 28, 92, 62, s.ch[k].n / p.cap, full ? '#ef5350' : '#3ecf8e', `${DN[k]} ${s.ch[k].n}/${p.cap}`);
      if (full) SL.tag(g, 'LLENO → recircula', q.x, top ? y0 - 104 : y0 + 100, SL.STATE.warn);
    }
    const rq = at(RJ); SL.chute(g, rq.x - 96, rq.y - 30, 70, 60, s.rej / 40, '#ef5350', `Rechazo ${s.rej}`);
    s.it.forEach((a) => { const q = at(a.s); parcel(q.x, q.y, a.ty, a); });
    SL.person(g, 70, 96, { dir: 1, busy: s.q > 0 }); SL.text(g, 'Inducción', 70, 112, '#8b9bb0', '10px system-ui', 'center');
    SL.person(g, 40, 380, { dir: 1, busy: s.rej > 0 }); SL.text(g, 'Excepciones', 40, 396, '#8b9bb0', '10px system-ui', 'center');
    SL.tag(g, `Cola de inducción: ${s.q}`, 250, 130, s.q > 20 ? SL.STATE.warn : SL.STATE.info);
    SL.text(g, 'Aro violeta: recirculando · aro rojo: no leído → rechazo · azul bolsa / cartón caja / amarillo irregular', 30, 436, '#8b9bb0', '11px system-ui');
  },
  kpis(s, p) {
    const hrs = Math.max(s.t, 1) / 3600, need = Math.ceil(p.rate / 250), sav = (need - 2) * p.sal, pay = (p.inv * 1000) / Math.max(sav, 1);
    return [
      { label: 'Bultos/h', value: (s.out / hrs).toFixed(0) },
      { label: '% bien clasificado', value: ((100 * s.ok) / Math.max(s.out, 1)).toFixed(1) + ' %' },
      { label: '% recirculado', value: p.mode === 0 ? 'n/a' : ((100 * s.rec) / Math.max(s.out, 1)).toFixed(1) + ' %' },
      { label: 'Rechazos (sin lectura)', value: s.rej },
      { label: 'Cola de inducción', value: s.q },
      { label: 'Personas clasificando', value: p.mode === 0 ? 6 : 2 },
      { label: 'Personas equivalentes hoy', value: need },
      { label: 'Payback estimado', value: sav <= 0 ? 'no conviene' : pay > 60 ? '> 60 meses' : pay.toFixed(0) + ' meses' },
    ];
  },
  series: (s) => ({ 'Cola': s.q, 'Clasificados': s.out, 'Recirculados': s.rec, 'Chute Lima': s.ch[0].n }),
});
</script></body></html>
