<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../shared/style.css"></head>
<body><div id="app"></div>
<script src="../../shared/controls.js"></script>
<script src="../../shared/sim.js"></script>
<script src="../../shared/gfx.js"></script>
<script>
// Packing e-commerce. Unidad: segundos desde las 15:00. Olas de pedidos; pico 17:00–20:00.
const hh = (t) => { const h = 15 + t / 3600; return String(Math.floor(h)).padStart(2, '0') + ':' + String(Math.floor((h % 1) * 60)).padStart(2, '0'); };
SL.app({
  title: 'Demo C · Packing e-commerce / courier',
  desc: 'Los pedidos no se atrasan en la calle: se atrasan en la mesa. Olas de pedidos hacia 4–8 puestos; en "hoy" la cola vive en el piso, en "propuesto" vive en la banda.',
  pitch: '"El camión no espera. Si el packing no rinde a las 7 pm, el pedido viaja mañana y el cliente se queja."',
  obj: '"Con más gente se resuelve." → Sube puestos en "hoy": se estorban (el límite es el layout, no el headcount).',
  unit: 's', dt: 1, sample: 120, speeds: [1, 20, 120, 480],
  clock: (t) => 'Hora ' + hh(t),
  params: [
    { id: 'mode', label: 'Escenario', opts: ['Hoy: mesas + pedidos en piso', 'Propuesto: banda central + espina'], value: 0 },
    { id: 'n', label: 'Puestos de packing', min: 4, max: 8, step: 1, value: 6 },
    { id: 'wave', label: 'Tamaño de ola', min: 40, max: 80, step: 5, value: 60, unit: 'pedidos' },
    { id: 'frag', label: 'Mix frágil (90 s)', min: 0, max: 60, step: 5, value: 25, unit: '%' },
    { id: 'cut', label: 'Cutoff del courier', min: 18, max: 21, step: 0.5, value: 20, unit: 'h' },
  ],
  init() { return { q: [], st: Array.from({ length: 8 }, () => ({ rem: 0, o: null, work: 0 })), nextWave: 0, done: 0, late: 0, err: 0, dest: [0, 0, 0], lsum: 0, back: null, arr: 0 }; },
  step(s, dt, p, r) {
    const hoy = p.mode === 0, h = 15 + s.t / 3600;
    if (s.t >= s.nextWave) {
      const gap = h >= 17 && h < 20 ? 900 : 2400, n = Math.round(p.wave * (0.9 + 0.2 * r()));
      for (let i = 0; i < n; i++) { const u = r(), f = p.frag / 100, ty = u < f ? 90 : u < f + (1 - f) * 0.3 ? 45 : 65, d = r(); s.q.push({ t0: s.t, ty, d: d < 0.55 ? 0 : d < 0.8 ? 1 : 2 }); s.arr++; }
      s.nextWave += gap;
    }
    const crowd = hoy ? 1 + 0.07 * Math.max(0, p.n - 4) : 1;
    for (let i = 0; i < p.n; i++) {
      const k = s.st[i];
      if (k.o) {
        k.work += dt;
        if ((k.rem -= dt) <= 0) {
          s.done++; s.dest[k.o.d]++; s.lsum += s.t - k.o.t0; if (r() < (hoy ? 0.012 : 0.004)) s.err++;
          if (h >= p.cut) s.late++; k.o = null;
        }
      }
      if (!k.o && s.q.length) { const o = s.q.shift(); k.o = o; k.rem = (o.ty + (hoy ? 14 : 3)) * crowd * (0.9 + 0.2 * r()); }
    }
    if (h >= p.cut && s.back === null) s.back = s.q.length + s.st.slice(0, p.n).filter((k) => k.o).length;
  },
  draw(g, s, p, W, H) {
    const hoy = p.mode === 0, y = 225, cap = 30, h = 15 + (s.t || 0) / 3600;
    const col = (o) => (o.ty > 80 ? '#c0504d' : o.ty < 50 ? '#d9c7a3' : '#b98a58');
    if (!hoy) {
      SL.belt(g, [[40, y], [640, y], [640, 110], [660, 110]], 22); SL.belt(g, [[640, y], [660, y]], 22); SL.belt(g, [[640, y], [640, 340], [660, 340]], 22);
      s.q.slice(0, cap).forEach((o, i) => SL.carton(g, 44 + i * 18, y - 8, 15, 15, col(o)));
    } else { g.fillStyle = 'rgba(239,83,80,.06)'; g.fillRect(40, y - 44, 560, 88); g.strokeStyle = 'rgba(239,83,80,.4)'; g.setLineDash([6, 4]); g.strokeRect(40.5, y - 43.5, 559, 87); g.setLineDash([]); }
    for (let i = 0; i < p.n; i++) {
      const c = i >> 1, side = i % 2 ? 1 : -1, x = 70 + c * 138, yy = y + side * (hoy ? 104 : 86), busy = !!s.st[i].o;
      if (!hoy) SL.belt(g, [[x + 30, y + side * 13], [x + 30, yy - side * 18]], 10);
      SL.table(g, x, yy - 6, 62);
      if (busy) SL.carton(g, x + 16, yy - 22, 22, 16, col(s.st[i].o));
      SL.person(g, x + 78, yy + 14, { dir: -1, busy });
      SL.led(g, x + 4, yy - 12, 2.4, busy ? SL.STATE.run : SL.STATE.idle, busy);
      SL.text(g, 'P' + (i + 1), x + 31, yy + 30, '#8b9bb0', '11px system-ui', 'center');
    }
    if (hoy) for (let i = 0; i < Math.min(s.q.length, 200); i++) SL.carton(g, 48 + (i % 40) * 13.6 + ((i * 7) % 3), y - 36 + Math.floor(i / 40) * 14, 11, 10, col(s.q[i]));
    else if (s.q.length > cap) for (let i = 0; i < Math.min(s.q.length - cap, 80); i++) SL.carton(g, 48 + (i % 40) * 13.6, y + 124 + Math.floor(i / 40) * 12, 11, 10, '#f5b942');
    ['Lima', 'Norte', 'Sur'].forEach((n, i) => { SL.chute(g, 668, 70 + i * 115, 110, 80, Math.min(1, s.dest[i] / 150), '#3ecf8e', n); SL.tag(g, `${s.dest[i]}`, 723, 164 + i * 115, SL.STATE.run); });
    if (h < p.cut) SL.van(g, 700, 440, { s: 0.75, dir: 1, open: true, cab: '#c0504d' }); else SL.tag(g, 'Camión del courier partió', 700, 430, SL.STATE.down);
    SL.text(g, hoy ? 'Cola en el PISO (pasillo)' : 'Cola en la BANDA (amarillo = desborde al piso)', 20, 26, hoy ? '#ef5350' : '#3ecf8e', '600 14px system-ui');
    SL.text(g, 'Crema: sobre · marrón: caja · rojo: frágil', 20, H - 8);
  },
  kpis(s, p) {
    const hrs = Math.max(s.t, 1) / 3600, floorQ = p.mode === 0 ? s.q.length : Math.max(0, s.q.length - 30);
    return [
      { label: 'Pedidos despachados', value: s.done + ' / ' + s.arr },
      { label: 'Pedidos/h por persona', value: (s.done / hrs / p.n).toFixed(1) },
      { label: 'Salen después del cutoff', value: s.late },
      { label: 'Pendientes al cutoff', value: s.back === null ? '—' : s.back },
      { label: 'm² de pasillo con WIP', value: (floorQ * 0.3).toFixed(1) },
      { label: 'Error de ítem', value: s.err },
      { label: 'Espera prom. en cola', value: (s.lsum / Math.max(s.done, 1) / 60).toFixed(1) + ' min' },
    ];
  },
  series: (s, p) => ({ 'Cola': s.q.length, 'Despachados': s.done, 'Puestos activos': s.st.slice(0, p.n).filter((k) => k.o).length }),
});
</script></body></html>
