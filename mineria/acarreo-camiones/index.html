<body><div id="app"></div>

<script>
// Ciclo: cola pala → carga → acarreo (sube cargado) → cola chancador → descarga a tolva → retorno (baja vacío). Unidad: minutos.
// Velocidad = mín(límite de despacho, potencia/fuerza de resistencia): F = m·g·(pendiente + rodadura). Consumo = ralentí + SFC·kW.
const S = { x: 110, y: 330 }, C = { x: 690, y: 120 };
const G = 9.81, EMPTY = 0.75, ETA = 0.85, SFC = 0.24, IDLE = 28; // m/s², masa vacío/carga útil, η tren motriz, L/kWh, L/h
const pt = (a, b, f, off) => ({ x: SL.lerp(a.x, b.x, f) + off, y: SL.lerp(a.y, b.y, f) + off });
const PH = { qS: 'Cola pala', load: 'Cargando', haul: 'Acarreo cargado', qC: 'Cola chancador', dump: 'Descargando', ret: 'Retorno vacío' };
const mkTruck = (i, t) => ({ ph: 'qS', rem: 0, tot: 1, id: i, dk: 0, v: 0, kw: 0, ret: 0, F: 0, lph: IDLE, fuel: 0, km: 0, tons: 0, cyc: 0, c0: t || 0, last: 0, dn: 0, dnT: 0 });
// Física de marcha: devuelve {v km/h, kw motor, F kN, ret kW retardo}
function drive(s, p, loaded) {
  const m = p.payload * (loaded ? 1 + EMPTY : EMPTY) * 1000, tr = ((loaded ? p.grade : -p.grade) + p.rr + (s.rain ? 2 : 0)) / 100, F = m * G * tr;
  const vmax = (loaded ? p.vl : p.ve) * (s.rain ? 0.7 : 1), vlim = F > 0 ? ((p.pw * 1000 * ETA) / F) * 3.6 : 1e9, v = Math.min(vmax, vlim), vs = v / 3.6;
  return { v, F: F / 1000, kw: Math.max(0, (F * vs) / ETA / 1000) + 0.08 * p.pw, ret: F < 0 ? (-F * vs) / 1000 : 0, lim: vlim < vmax };
}
// Match factor = camiones disponibles · t carga / t ciclo sin colas (1 pala)
const matchF = (s, p) => { const a = drive(s, p, true), b = drive(s, p, false), cyc = p.load + p.dump + (p.dist / a.v) * 60 + (p.dist / b.v) * 60; return (s.trucks.filter((t) => !t.dn).length * p.load) / cyc; };
const onRoute = (t) => t.ph === 'haul' || t.ph === 'ret';
const isLoaded = (t) => t.ph === 'haul' || t.ph === 'qC' || t.ph === 'dump';
// Posición dibujada de cada camión (la usan draw y el mapa de calor)
function tPos(s, p, t) {
  const f = SL.clamp(1 - t.dk / p.dist, 0, 1);
  if (t.ph === 'haul') return { ...pt(S, C, f, -14), dir: 1 };
  if (t.ph === 'ret') return { ...pt(C, S, f, 14), dir: -1 };
  if (t.ph === 'qS') return { x: S.x + 46 + 34 * (s.qS.indexOf(t) + 1), y: S.y + 54, dir: -1 };
  if (t.ph === 'qC') return { x: C.x - 52 - 34 * (s.qC.indexOf(t) + 1), y: C.y - 26, dir: 1 };
  if (t.ph === 'load') return { x: S.x + 34, y: S.y + 10, dir: -1 };
  return { x: C.x - 50, y: C.y - 26, dir: -1 }; // descargando en reversa a la tolva
}
// Emisión de polvo PM10 en camino no pavimentado (AP-42 §13.2.2): E[kg/VKT] = 0.2819·1.5·(s/12)^0.9·(W/3)^0.45, W en t cortas, limo s = 8 %.
// Camino mojado (lluvia) ≈ −90 %. Devuelve kg/h.
const pm10 = (s, p, t) => { if (!onRoute(t) || t.dn || t.v <= 0) return 0; const W = p.payload * (isLoaded(t) ? 1 + EMPTY : EMPTY) * 1.1023; return 0.2819 * 1.5 * 0.694 * (W / 3) ** 0.45 * t.v * (s.rain ? 0.1 : 1); };
const RL = Math.hypot(C.x - S.x, C.y - S.y), UX = (C.x - S.x) / RL, UY = (C.y - S.y) / RL;
// Corte del rajo en terrazas: cresta del banco k (0 = superficie) en función de x
const bench = (k, x) => 215 + k * 33 - 0.06 * x * (1 - k / 4);
let BG = null;
function scene() { // fondo estático (cielo, cordillera, bancos, piso del rajo, tendido eléctrico), pre-renderizado una vez
  if (BG) return BG;
  BG = document.createElement('canvas'); BG.width = 1600; BG.height = 900; const g = BG.getContext('2d'); g.scale(2, 2);
  const r = SL.rng(11);
  g.fillStyle = SL.vgrad(g, 0, 210, 'rgba(22,38,58,.9)', 'rgba(14,20,27,0)'); g.fillRect(0, 0, 800, 210);
  for (let k = 0; k < 40; k++) { g.fillStyle = `rgba(220,230,245,${0.15 + 0.35 * r()})`; g.fillRect(r() * 800, r() * 90, 1, 1); } // estrellas
  const ridge = (pts, base, col) => { g.beginPath(); g.moveTo(0, base); pts.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(800, base); g.closePath(); g.fillStyle = col; g.fill(); };
  ridge([[0, 128], [60, 100], [130, 118], [220, 66], [300, 104], [390, 82], [470, 108], [560, 54], [640, 92], [720, 70], [800, 96]], 230, '#17212d');
  g.fillStyle = 'rgba(230,236,245,.18)'; for (const [x, y] of [[220, 66], [560, 54], [720, 70]]) { g.beginPath(); g.moveTo(x - 16, y + 12); g.lineTo(x, y); g.lineTo(x + 18, y + 13); g.lineTo(x + 6, y + 9); g.lineTo(x - 4, y + 12); g.fill(); } // nieve
  ridge([[0, 168], [80, 150], [190, 166], [290, 142], [410, 160], [510, 138], [600, 152], [690, 140], [800, 146]], 240, '#211d1a');
  // Bancos del rajo: cara (oscura) + berma (clara) + cresta iluminada
  for (let k = 0; k < 4; k++) {
    g.beginPath(); for (let x = 0; x <= 800; x += 40) g.lineTo(x, bench(k, x)); for (let x = 800; x >= 0; x -= 40) g.lineTo(x, bench(k + 1, x)); g.closePath();
    g.fillStyle = ['#3a2f26', '#352a21', '#30261e', '#2b221b'][k]; g.fill();
    g.beginPath(); for (let x = 0; x <= 800; x += 40) g.lineTo(x, bench(k, x)); for (let x = 800; x >= 0; x -= 40) g.lineTo(x, bench(k, x) + 11); g.closePath();
    g.fillStyle = 'rgba(15,10,6,.45)'; g.fill();
    g.strokeStyle = 'rgba(255,230,200,.10)'; g.lineWidth = 1.5; g.beginPath(); for (let x = 0; x <= 800; x += 40) g.lineTo(x, bench(k, x)); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 1; for (let x = 6; x < 800; x += 9 + r() * 9) { const y0 = bench(k, x); g.beginPath(); g.moveTo(x, y0 + 1); g.lineTo(x + 2 - r() * 4, y0 + 10); g.stroke(); } // estrías de la cara
    for (let n = 0; n < 26; n++) { const x = r() * 800, y = bench(k, x) + 14 + r() * 16, w = 2 + r() * 4; g.fillStyle = `rgba(${90 + r() * 40},${72 + r() * 30},${55 + r() * 25},.7)`; g.beginPath(); g.moveTo(x - w, y); g.lineTo(x - w * 0.4, y - w * 0.8); g.lineTo(x + w * 0.6, y - w * 0.6); g.lineTo(x + w, y); g.fill(); }
  }
  // Malla de perforación en el banco 1 (próxima tronadura)
  for (let i = 0; i < 9; i++) for (let j = 0; j < 2; j++) { const x = 330 + i * 11 + j * 5, y = bench(1, x) + 18 + j * 7; g.fillStyle = '#120d09'; g.beginPath(); g.ellipse(x, y, 1.8, 0.9, 0, 0, 7); g.fill(); g.fillStyle = '#e8672b'; g.fillRect(x + 1.5, y - 4, 0.8, 4); }
  // Piso del rajo con huellas y charcos secos
  const fl = bench(4, 0); g.fillStyle = SL.vgrad(g, fl, 450 - fl, '#2a221b', '#1b1612'); g.beginPath(); for (let x = 0; x <= 800; x += 40) g.lineTo(x, bench(4, x)); g.lineTo(800, 450); g.lineTo(0, 450); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 2; g.setLineDash([2, 3]);
  for (const o of [0, 7]) { g.beginPath(); g.moveTo(150, 360 + o); g.bezierCurveTo(260, 400 + o, 420, 400 + o, 560, 388 + o); g.stroke(); g.beginPath(); g.moveTo(170, 352 + o); g.quadraticCurveTo(130, 380 + o, 150, 420 + o); g.stroke(); }
  g.setLineDash([]);
  for (let n = 0; n < 160; n++) { g.fillStyle = `rgba(${r() < 0.5 ? '255,230,200' : '0,0,0'},${0.05 + r() * 0.08})`; g.fillRect(r() * 800, fl + 4 + r() * (446 - fl), 1.5, 1.5); }
  // Plataforma de planta con muro de contención (tierra armada) y baranda
  g.fillStyle = SL.vgrad(g, C.y + 44, 52, '#4a4e52', '#2c3034'); g.fillRect(606, C.y + 44, 194, 52);
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1; for (let x = 606; x < 800; x += 16) for (let y = C.y + 50; y < C.y + 96; y += 12) g.strokeRect(x + ((y / 12) % 2) * 8, y, 16, 12);
  g.fillStyle = '#5b6066'; g.fillRect(600, C.y + 42, 200, 5); g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(600, C.y + 42, 200, 1);
  g.strokeStyle = '#f5c542'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(604, C.y + 42); g.lineTo(604, C.y + 32); g.lineTo(612, C.y + 32); g.stroke();
  // Terraplén y plataforma de espera en la cota del chancador (fin de rampa)
  g.beginPath(); g.moveTo(296, C.y - 14); g.lineTo(640, C.y - 14); for (let x = 640; x >= 236; x -= 20) g.lineTo(x, bench(0, x)); g.closePath();
  g.fillStyle = SL.vgrad(g, C.y - 14, 90, '#3b3027', '#2f261e'); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.2)'; g.lineWidth = 1; for (let x = 300; x < 640; x += 7 + r() * 8) { g.beginPath(); g.moveTo(x, C.y - 12); g.lineTo(x - 3 + r() * 6, C.y - 2 + r() * 14); g.stroke(); }
  g.fillStyle = '#4a3d31'; g.fillRect(286, C.y - 14, 420, 8); g.fillStyle = SL.vgrad(g, C.y - 30, 18, '#7a6752', '#5e4f40'); g.fillRect(286, C.y - 30, 420, 16);
  g.fillStyle = 'rgba(255,240,220,.12)'; g.fillRect(286, C.y - 30, 420, 1.2);
  g.fillStyle = '#5e4f40'; for (let x = 292; x < 600; x += 22) { g.beginPath(); g.moveTo(x - 4, C.y - 29); g.lineTo(x, C.y - 34); g.lineTo(x + 4, C.y - 29); g.fill(); } // berma de seguridad
  // Tendido eléctrico de media tensión hacia la planta
  const poles = [[262, bench(0, 262)], [420, bench(0, 420)], [560, bench(0, 560)], [612, C.y + 42]];
  poles.forEach(([x, y]) => { g.strokeStyle = '#4a3a2a'; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - 46); g.stroke(); g.strokeStyle = '#6b5a48'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x - 8, y - 42); g.lineTo(x + 8, y - 42); g.stroke(); g.fillStyle = '#c3ccd6'; for (const d of [-7, 0, 7]) g.fillRect(x + d - 0.6, y - 45, 1.2, 3); });
  g.strokeStyle = 'rgba(30,30,30,.8)'; g.lineWidth = 0.7;
  for (let i = 1; i < poles.length; i++) for (const d of [-7, 0, 7]) { const [ax, ay] = poles[i - 1], [bx, by] = poles[i]; g.beginPath(); g.moveTo(ax + d, ay - 44); g.quadraticCurveTo((ax + bx) / 2 + d, (ay + by) / 2 - 34, bx + d, by - 44); g.stroke(); }
  // Camino de acarreo con bermas de seguridad
  SL.road(g, [[S.x, S.y], [C.x, C.y]], 54);
  g.fillStyle = 'rgba(0,0,0,.25)'; for (let d = 30; d < RL - 20; d += 34) for (const o of [-38, 38]) { const x = S.x + UX * d - UY * o, y = S.y + UY * d + UX * o; g.beginPath(); g.ellipse(x, y + 1, 4, 2, 0, 0, 7); g.fill(); }
  for (let d = 30; d < RL - 20; d += 34) for (const o of [-38, 38]) { const x = S.x + UX * d - UY * o, y = S.y + UY * d + UX * o; g.fillStyle = '#6a5847'; g.beginPath(); g.moveTo(x - 4, y + 1); g.lineTo(x - 1, y - 3.5); g.lineTo(x + 3, y - 2.5); g.lineTo(x + 4.5, y + 1); g.fill(); } // rocas de berma
  // Luz de torres de iluminación sobre el piso
  SL.lightPool(g, 30, 360, 110, 0.07); SL.lightPool(g, 560, 360, 120, 0.06);
  return BG;
}
// Torre de iluminación móvil (remolque diésel + mástil + 4 focos)
function lightTower(g, x, y, h = 58) {
  SL.contact(g, x, y, 14, 3);
  g.fillStyle = SL.metal(g, y - 10, 10, '#c9912a'); g.fillRect(x - 11, y - 11, 22, 8); SL.wheel(g, x - 5, y - 3, 3); SL.wheel(g, x + 6, y - 3, 3);
  g.strokeStyle = '#8b9bb0'; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y - 11); g.lineTo(x, y - h); g.stroke();
  g.fillStyle = '#2a3440'; g.fillRect(x - 10, y - h - 3, 20, 3);
  for (let k = 0; k < 4; k++) { const lx = x - 8.5 + k * 5.5; g.fillStyle = '#20282f'; g.fillRect(lx - 2, y - h - 8, 4.5, 5); const gr = g.createRadialGradient(lx, y - h - 5, 0, lx, y - h - 5, 10); gr.addColorStop(0, 'rgba(255,240,200,.55)'); gr.addColorStop(1, 'rgba(255,240,200,0)'); g.fillStyle = gr; g.fillRect(lx - 10, y - h - 15, 20, 20); g.fillStyle = '#fff6d8'; g.fillRect(lx - 1.4, y - h - 7, 3, 3); }
}
SL.app({
  title: 'Minería · Ciclo de acarreo',
  desc: 'Camiones compiten por 1 pala y 1 chancador con tolva. Sube la flota hasta que la productividad se sature y crezcan las colas; provoca fallas, lluvia o atollos. Clic en camiones y equipos para inspeccionar.',
  unit: 'min', dt: 0.1, sample: 5,
  clock: (t) => `Turno: ${Math.floor(t / 60)} h ${Math.floor(t % 60)} min`,
  params: [
    { sec: 'Flota y ruta', id: 'n', label: 'Camiones', min: 1, max: 20, step: 1, value: 8, reset: true },
    { id: 'payload', label: 'Carga útil', min: 100, max: 360, step: 10, value: 220, unit: 't' },
    { id: 'dist', label: 'Distancia de acarreo', min: 1, max: 10, step: 0.5, value: 4, unit: 'km' },
    { id: 'grade', label: 'Pendiente de rampa', min: 0, max: 12, step: 0.5, value: 5, unit: '%' },
    { id: 'rr', label: 'Resistencia a la rodadura', min: 1, max: 6, step: 0.5, value: 2, unit: '%' },
    { id: 'pw', label: 'Potencia de motor', min: 1000, max: 3000, step: 50, value: 2000, unit: 'kW' },
    { id: 'mtbf', label: 'MTBF camión', min: 5, max: 200, step: 5, value: 60, unit: 'h' },
    { id: 'mttr', label: 'MTTR camión', min: 5, max: 120, step: 5, value: 30, unit: 'min' },
    { sec: 'Carguío y chancado', id: 'load', label: 'Tiempo de carga', min: 1, max: 8, step: 0.5, value: 3.5, unit: 'min' },
    { id: 'dump', label: 'Tiempo de descarga', min: 0.5, max: 5, step: 0.5, value: 1.5, unit: 'min' },
    { id: 'cr', label: 'Capacidad chancador', min: 1500, max: 8000, step: 100, value: 4500, unit: 't/h' },
    { id: 'hop', label: 'Capacidad de tolva', min: 300, max: 1500, step: 50, value: 600, unit: 't' },
    { sec: 'Control y despacho', id: 'vl', label: 'Límite vel. cargado', min: 10, max: 40, step: 1, value: 22, unit: 'km/h' },
    { id: 've', label: 'Límite vel. vacío', min: 15, max: 50, step: 1, value: 32, unit: 'km/h' },
    { id: 'plan', label: 'Meta de producción', min: 1000, max: 8000, step: 100, value: 3500, unit: 't/h' },
    { id: 'qal', label: 'Alarma de cola', min: 1, max: 10, step: 1, value: 4, unit: 'camiones' },
  ],
  init(p) {
    const trucks = [], s = { qS: [], qC: [], shov: null, crus: null, tons: 0, bS: 0, bC: 0, wq: 0, trucks, hop: 0, crushed: 0, ckw: 0, kwh: 0, fuel: 0, ema: 0, cycAvg: 0, nCyc: 0, shDn: false, crDn: false, rain: false, qAl: false, hiAl: false, fails: 0, downT: 0 };
    for (let i = 0; i < p.n; i++) { const t = mkTruck(i); trucks.push(t); s.qS.push(t); }
    return s;
  },
  step(s, dt, p, r) {
    const T = s.t || 0;
    while (s.trucks.length < p.n) { const t = mkTruck(s.trucks.length, T); s.trucks.push(t); s.qS.push(t); } // camión agregado en vivo
    if (!s.shov && s.qS.length && !s.shDn) { s.shov = s.qS.shift(); s.shov.ph = 'load'; s.shov.rem = p.load * (0.7 + 0.6 * r()); }
    if (s.shov && !s.shDn) { s.bS += dt; if ((s.shov.rem -= dt) <= 0) { const t = s.shov; t.ph = 'haul'; t.dk = p.dist; t.tot = t.rem = (p.dist / p.vl) * 60; s.shov = null; } }
    // Descarga sólo si hay espacio en tolva (enclavamiento de nivel alto) y el chancador no está atollado
    if (!s.crus && s.qC.length && !s.crDn && s.hop + p.payload <= p.hop) { s.crus = s.qC.shift(); s.crus.ph = 'dump'; s.crus.rem = p.dump * (0.7 + 0.6 * r()); }
    if (s.crus && !s.crDn) { s.bC += dt; if ((s.crus.rem -= dt) <= 0) { const t = s.crus; s.tons += p.payload; s.hop += p.payload; s.ema += p.payload; t.tons += p.payload; t.ph = 'ret'; t.dk = p.dist; t.tot = t.rem = (p.dist / p.ve) * 60; s.crus = null; } }
    s.ema *= Math.exp(-dt / 60); // ritmo móvil (t/h, τ = 60 min)
    // Chancador: consume la tolva a su capacidad
    const feed = s.crDn ? 0 : Math.min(s.hop, (p.cr / 60) * dt);
    s.hop -= feed; s.crushed += feed; s.cfeed = (feed / dt) * 60;
    s.ckw = s.crDn ? 0 : 150 + 0.3 * s.cfeed; s.kwh += (s.ckw * dt) / 60;
    for (const t of s.trucks) {
      let d = null;
      if (t.dn > 0) { t.v = 0; t.kw = 0.05 * p.pw; t.ret = 0; t.F = 0; s.downT += dt; if ((t.dn -= dt) <= 0) { t.dn = 0; SL.log(s, `CAEX-${t.id + 1} reparado, vuelve a ruta`, 'ok'); } }
      else if (onRoute(t)) {
        d = drive(s, p, t.ph === 'haul'); t.v = d.v; t.kw = d.kw; t.ret = d.ret; t.F = d.F; t.lim = d.lim;
        const dk = Math.min(t.dk, (d.v * dt) / 60); t.dk -= dk; t.km += dk; t.rem = (t.dk / Math.max(d.v, 0.1)) * 60;
        if (r() < dt / (p.mtbf * 60)) { t.dn = SL.exp(r, p.mttr); s.fails++; SL.log(s, `CAEX-${t.id + 1} falla en ruta (${t.dn.toFixed(0)} min)`, 'crit'); }
        else if (t.dk <= 1e-9) {
          if (t.ph === 'haul') { t.ph = 'qC'; s.qC.push(t); }
          else { t.ph = 'qS'; s.qS.push(t); t.last = T - t.c0; t.c0 = T; t.cyc++; s.nCyc++; s.cycAvg += (t.last - s.cycAvg) / Math.min(s.nCyc, 20); }
        }
      } else { t.v = 0; t.ret = 0; t.F = 0; t.kw = (t.ph === 'load' || t.ph === 'dump' ? 0.15 : 0.05) * p.pw; }
      t.lph = IDLE + SFC * t.kw; t.fuel += (t.lph * dt) / 60; s.fuel += (t.lph * dt) / 60;
    }
    s.wq += (s.qS.length + s.qC.length) * dt;
    // Alarmas por transición de estado
    const qa = Math.max(s.qS.length, s.qC.length) >= p.qal;
    if (qa !== s.qAl) { s.qAl = qa; SL.log(s, qa ? `Alarma: cola ≥ ${p.qal} camiones (pala ${s.qS.length} / chancador ${s.qC.length})` : 'Colas normalizadas', qa ? 'warn' : 'ok'); }
    const hi = s.hop + p.payload > p.hop;
    if (hi !== s.hiAl) { s.hiAl = hi; if (s.qC.length || !hi) SL.log(s, hi ? 'Tolva en nivel alto: enclavamiento de descarga' : 'Tolva con espacio: descarga habilitada', hi ? 'warn' : 'ok'); }
  },
  draw(g, s, p, W, H) {
    const T = s.t || 0, ST = SL.STATE;
    g.drawImage(scene(), 0, 0, 800, 450);
    if (s.qC.length) SL.zone(g, Math.max(290, C.x - 72 - 34 * s.qC.length), C.y - 30, Math.min(332, 34 * s.qC.length + 6), 16, { color: s.qC.length >= p.qal ? ST.warn : '#f5b942', fill: 0.08, dash: [5, 4] });
    if (s.rain) { g.save(); g.globalAlpha = 0.5; g.strokeStyle = 'rgba(120,170,220,.18)'; g.lineWidth = 50; g.beginPath(); g.moveTo(S.x, S.y); g.lineTo(C.x, C.y); g.stroke(); g.fillStyle = 'rgba(140,190,240,.22)'; for (const [x, y, w] of [[240, 404, 40], [380, 420, 60], [520, 398, 30], [120, 430, 50]]) { g.beginPath(); g.ellipse(x, y, w / 2, 3, 0, 0, 7); g.fill(); } g.restore(); }
    SL.hot('road', 330, 200, 140, 70);
    // Señalética de ruta

      { label: 'Combustible', value: s.tons ? (s.fuel / s.tons).toFixed(2) + ' L/t' : '—' },
    ];
  },
  series: (s) => ({ 'Cola pala': s.qS.length, 'Cola chancador': s.qC.length, 'Toneladas acum.': s.tons, 'Tolva t': s.hop, 'Ritmo t/h': s.ema }),
});
</script></body></html>
