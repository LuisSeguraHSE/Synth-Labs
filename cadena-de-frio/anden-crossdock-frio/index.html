<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../shared/style.css"></head>
<body><div id="app"></div>
<script src="../../shared/controls.js"></script>
<script src="../../shared/sim.js"></script>
<script src="../../shared/gfx.js"></script>
<script>
// Andén / cross-dock con frío: pallets que esperan expuestos entre camión y cámara. Unidad: minutos.
// Pallet = 800 kg de producto (cp 3.5 kJ/kg·K) que se calienta hacia la T° del andén con τ = 120 min.
// Andén frío: UA = 1.2 kW/K contra el exterior + calor que absorben los pallets; COP 2.8. Montacargas 0.03 kWh por viaje.
const MP = 800, CPP = 3.5, UA = 1.2, COPD = 2.8, EFK = 0.03, RULE = ['FIFO (orden de llegada)', 'Más caliente primero'];
const qpos = (i, y) => [142 + (i % 8) * 39, y - 70 + Math.floor(i / 8) * 50]; // posición de dibujo del pallet i de la cola
// Nave: muro interior, bandeja portacables, patio exterior, piso del andén y de la cámara (pre-renderizado una vez).
let DOCK = null;
const dockCache = () => {
  if (DOCK) return DOCK;
  DOCK = document.createElement('canvas'); DOCK.width = 1600; DOCK.height = 900; const g = DOCK.getContext('2d'); g.scale(2, 2); const r = SL.rng(9), fy = 274;
  g.fillStyle = '#121a22'; g.fillRect(0, 0, 800, 450);
  g.fillStyle = SL.vgrad(g, 0, 70, '#1a232d', '#151d26'); g.fillRect(126, 0, 674, 70); // muro interior alto
  g.strokeStyle = 'rgba(0,0,0,.3)'; for (let x = 126; x < 800; x += 8) { g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, 70); g.stroke(); }
  g.fillStyle = '#0f151c'; g.fillRect(0, 0, 126, fy); // exterior (patio de maniobras, noche)
  for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(230,237,243,${0.2 + r() * 0.4})`; g.fillRect(r() * 120, r() * 90, 1, 1); }
  g.fillStyle = '#26303a'; g.fillRect(0, 95, 126, 6); g.fillStyle = 'rgba(255,233,168,.12)'; g.beginPath(); g.moveTo(80, 101); g.lineTo(40, fy); g.lineTo(126, fy); g.lineTo(100, 101); g.fill(); // luminaria exterior
  g.fillStyle = SL.vgrad(g, 40, 62, '#2a3440', '#1e262f'); g.fillRect(0, 40, 126, 62); g.strokeStyle = 'rgba(0,0,0,.3)'; for (let x = 4; x < 126; x += 6) { g.beginPath(); g.moveTo(x, 40); g.lineTo(x, 101); g.stroke(); } // fachada sobre el portón
  g.fillStyle = '#3a4654'; g.fillRect(122, 40, 8, fy - 40); // jamba del portón
  SL.cableTray(g, 130, 58, 800, { drop: 12 });
  const fl = g.createLinearGradient(0, fy, 0, 300); fl.addColorStop(0, '#2a3440'); fl.addColorStop(1, '#141a20'); g.fillStyle = fl; g.fillRect(0, fy, 800, 26); // losa / patio
  g.fillStyle = '#20262c'; g.fillRect(0, fy, 126, 26); for (let i = 0; i < 300; i++) { g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(r() * 126, fy + r() * 26, 1.2, 1.2); }
  g.fillStyle = 'rgba(245,185,66,.55)'; g.fillRect(140, fy + 1, 320, 1.5); g.fillRect(140, fy + 9, 320, 1.5); // pasillo peatonal
  g.fillStyle = 'rgba(245,185,66,.25)'; for (let x = 146; x < 460; x += 16) { g.beginPath(); g.moveTo(x, fy + 2.5); g.lineTo(x + 6, fy + 2.5); g.lineTo(x + 2, fy + 9); g.lineTo(x - 4, fy + 9); g.fill(); }
  g.fillStyle = 'rgba(159,227,255,.12)'; g.fillRect(560, fy, 226, 26); // piso de la cámara
  return DOCK;
};
SL.app({
  title: 'Cadena de frío · Andén y cross-dock refrigerado',
  desc: 'Cada camión llega con pallets que quedan expuestos al ambiente del andén hasta que un operario los mueve a cámara. La cola en andén es cadena de frío rota. Clic en pallets, montacargas, camión o cámara.',
  pitch: '"La cadena de frío se rompe en los 15 metros entre el camión y la cámara."',
  obj: '"Un andén refrigerado es muy caro." → Compara reclamos y pallets rechazados contra el costo de mercadería dañada.',
  unit: 'min', dt: 0.1, sample: 5, speeds: [1, 10, 60, 240],
  params: [
    { sec: 'Escenario', id: 'mode', label: 'Escenario', opts: ['Hoy: andén ambiente + 2 montacargas', 'Propuesto: andén frío + rodillos'], value: 0 },
    { sec: 'Llegadas', id: 'np', label: 'Pallets por camión', min: 8, max: 40, step: 2, value: 20 },
    { id: 'gap', label: 'Un camión cada', min: 15, max: 90, step: 5, value: 35, unit: 'min' },
    { sec: 'Recursos y despacho', id: 'extra', label: 'Montacargas / operarios extra', min: 0, max: 3, step: 1, value: 0 },
    { id: 'dist', label: 'Distancia andén → cámara', min: 5, max: 40, step: 5, value: 15, unit: 'm' },
    { id: 'rule', label: 'Regla de despacho', opts: RULE, value: 0, reset: false },
    { sec: 'Físicos y umbrales', id: 'tamb', label: 'Ambiente exterior', min: 15, max: 40, step: 1, value: 28, unit: '°C' },
    { id: 'lim', label: 'Umbral de pallet', min: 3, max: 8, step: 0.5, value: 5, unit: '°C' },
    { id: 'rej', label: 'Rechazo si supera', min: 6, max: 12, step: 0.5, value: 8, unit: '°C' },
  ],
  init(p) { return { q: [], srv: [], sv: 0, n: 0, bad: 0, rej: 0, sumPk: 0, nextT: 0, expo: 0, hist: [], seq: 0, trucks: 0, tdock: p.mode === 0 ? p.tamb - 4 : 8, qpal: 0, qref: 0, pel: 0, kwhD: 0, kwhF: 0, km: 0, sumW: 0, busyT: 0, capT: 0, fk: false, blk: false, alQ: false, lastRej: -1e9 }; },
  step(s, dt, p, r) {
    const hoy = p.mode === 0, nsrv = (hoy ? 2 : 1) + p.extra, svc = (hoy ? 2.8 : 1.2) * (p.dist / 15), tgt = hoy || s.blk ? p.tamb - 4 : 8, tau = 120;
    s.tdock += tgt === s.tdock ? 0 : (tgt - s.tdock) * Math.min(1, dt / 20); // el aire del andén responde con τ = 20 min
    const tdock = s.tdock;
    if (s.t >= s.nextT) { for (let i = 0; i < p.np; i++) s.q.push({ T: 2, a: s.t, bad: 0, id: s.seq++ }); s.nextT += p.gap; s.trucks++; }
    let qp = 0;
    const exp = (o) => { const d = (dt * (tdock - o.T)) / tau; o.T += d; qp += (d / dt) * MP * CPP / 60; if (o.T > p.lim) o.bad += dt; }; // qp en kW
    s.q.forEach(exp);
    if (p.rule === 1) s.q.sort((a, b) => b.T - a.T);
    for (let i = 0; i < Math.max(nsrv, s.srv.length); i++) {
      const k = s.srv[i] || (s.srv[i] = { o: null, rem: 0, down: false, mv: 0 });
      const dn = k.down || (i === 0 && s.fk);
      if (k.o) { exp(k.o); if (!dn && (k.rem -= dt) <= 0) { const o = k.o; k.o = null; s.n++; k.mv++; s.sumPk += o.T; s.bad += o.bad; s.sumW += s.t - o.a; s.km += (2 * p.dist) / 1000; if (hoy) s.kwhF += EFK * p.dist / 15;
        if (o.T > p.rej) { s.rej++; if (s.t - s.lastRej > 30) SL.log(s, `Rechazos: pallet ingresa a ${o.T.toFixed(1)} °C`, 'crit'); s.lastRej = s.t; } s.hist.push(o.T); } }
      if (i < nsrv && !dn) { s.capT += dt; if (k.o) s.busyT += dt; }
      if (!k.o && !dn && i < nsrv && s.q.length) { k.o = s.q.shift(); k.rem = svc * (0.85 + 0.3 * r()); }
    }
    s.qpal = qp;
    s.qref = hoy ? 0 : Math.max(0, UA * (p.tamb - tdock) + qp); // carga del equipo del andén frío
    s.pel = s.qref / COPD + (!hoy && s.srv[0] && s.srv[0].o ? 0.75 : 0); // + motor de rodillos
    s.kwhD += (s.pel * dt) / 60;
    const aq = s.q.length > p.np; if (aq && !s.alQ) SL.log(s, `Cola en andén supera un camión (${s.q.length} pallets)`, 'warn'); else if (!aq && s.alQ) SL.log(s, 'Cola en andén normalizada', 'ok'); s.alQ = aq;
  },
  draw(g, s, p, W, H) {
    const hoy = p.mode === 0, y = 190, fy = y + 84, nsrv = (hoy ? 2 : 1) + p.extra, t = s.t || 0, warm = hoy || s.blk;
    g.drawImage(dockCache(), 0, 0, W, H);
    // luminarias del andén y de la cámara
    for (const lx of [200, 330, 440]) { SL.lightPool(g, lx, y + 20, 95, 0.07); g.fillStyle = '#3a4654'; g.fillRect(lx - 12, 64, 24, 4); g.fillStyle = 'rgba(255,240,210,.85)'; g.fillRect(lx - 10, 68, 20, 1.6); }
    for (const lx of [610, 740]) SL.lightPool(g, lx, y + 10, 80, 0.06, '200,230,255');
    // aire caliente entrando por el portón (andén ambiente)
    if (warm) for (let k = 0; k < 3; k++) { const x = 140 + ((t * 18 + k * 40) % 120); g.strokeStyle = `rgba(255,150,90,${0.35 * (1 - (x - 140) / 120)})`; g.lineWidth = 1.4; g.beginPath(); g.moveTo(x - 8, y - 40 + k * 12); g.quadraticCurveTo(x - 4, y - 44 + k * 12, x, y - 40 + k * 12); g.lineTo(x - 3, y - 43 + k * 12); g.stroke(); }
    // portón del andén con abrigo (sellos), nivelador y semáforo
    g.fillStyle = SL.metal(g, 108, 20, '#5b6b80'); g.fillRect(118, 108, 22, 14); g.strokeStyle = 'rgba(0,0,0,.4)'; for (let k = 110; k < 122; k += 3) { g.beginPath(); g.moveTo(118, k); g.lineTo(140, k); g.stroke(); } // portón seccional recogido
    g.fillStyle = '#15191e'; g.fillRect(122, 122, 10, 14); g.fillRect(122, fy - 62, 6, 62 - 8); // sello superior y lateral
    g.fillStyle = '#2a3038'; g.fillRect(120, fy - 12, 8, 10); SL.bolt(g, 124, fy - 7, 1.2); // tope de goma
    SL.hazard(g, 126, fy - 2, 26, 4, 0.9); g.fillStyle = SL.metal(g, fy - 4, 3, '#8a96a3'); g.fillRect(126, fy - 5, 26, 3); // nivelador
    SL.stackLight(g, 146, 132, s.q.length > p.np ? 'down' : 'run', { s: 0.8 });
    SL.sign(g, 62, 70, 'ANDÉN 1 · RECEPCIÓN', { color: '#2f6fb0' });
    // camión con calza en la rueda y neblina fría saliendo de la caja
    SL.van(g, 104, fy, { s: 1.5, dir: -1, open: true, reefer: true, body: '#e8eef5', cab: '#1f6f8b' }); SL.hot('truck', 20, fy - 56, 120, 58);
    g.fillStyle = '#f5c542'; g.beginPath(); g.moveTo(104, fy); g.lineTo(98, fy); g.lineTo(104, fy - 5); g.fill();
    for (let k = 0; k < 5; k++) { const ph = (t * 0.6 + k / 5) % 1; g.fillStyle = `rgba(220,240,255,${0.3 * (1 - ph)})`; g.beginPath(); g.arc(128 + ph * 26, fy - 10 + ph * 6 - (k % 2) * 6, 3 + ph * 6, 0, 7); g.fill(); }
    for (let k = 0; k < 3; k++) { const ph = (t * 0.9 + k / 3) % 1; g.fillStyle = `rgba(150,158,168,${0.3 * (1 - ph)})`; g.beginPath(); g.arc(28 - ph * 14, fy - 52 - ph * 16, 2 + ph * 5, 0, 7); g.fill(); } // vapor del equipo de frío del camión
    // andén: zona de espera
    SL.zone(g, 132, y - 90, 330, 176, { color: warm ? '#f5b942' : '#4fc3f7', fill: warm ? 0.06 : 0.08, dash: [6, 4] });
    SL.hot('dock', 132, y - 90, 330, 176);
    SL.tag(g, hoy ? `ANDÉN AMBIENTE ${s.tdock.toFixed(0)} °C` : s.blk ? `ANDÉN SIN FRÍO ${s.tdock.toFixed(1)} °C` : `ANDÉN REFRIGERADO ${s.tdock.toFixed(1)} °C`, 297, y - 102, warm ? SL.STATE.warn : SL.STATE.info);
    if (!hoy) { g.fillStyle = SL.metal(g, 62, 12, '#9aa6b3'); g.fillRect(422, 62, 38, 12); SL.fan(g, 433, 68, 4.5, !s.blk, 1.2); SL.fan(g, 449, 68, 4.5, !s.blk, 1.2); } // evaporador del andén
    const col = (T) => SL.color(1 - SL.clamp((T - 2) / (p.rej - 2), 0, 1));
    const pallet = (x, yy, T, w = 32) => { SL.contact(g, x + w / 2, yy + 33, w * 0.55, 2.5, 0.4); SL.pallet(g, x, yy + 26, w); for (let r = 0; r < 2; r++) for (let k = 0; k < 2; k++) SL.carton(g, x + 1 + k * (w / 2 - 0.5), yy + 2 + r * 12, w / 2 - 1, 12, col(T)); };
    s.q.slice(0, 24).forEach((o, i) => { const [px, py] = qpos(i, y); pallet(px, py, o.T); SL.hot('pal:' + o.id, px, py, 34, 34); if (o.T > p.rej) SL.led(g, px + 30, py + 2, 2, SL.STATE.down, Math.floor(t * 3) % 2 === 0); });
    if (s.q.length > 24) SL.tag(g, `+${s.q.length - 24} pallets`, 420, y + 78, SL.STATE.down);
    // supervisor caminando por el pasillo peatonal con tablilla
    const sx = 150 + ((t * 7) % 290); SL.person(g, sx, fy, { s: 0.85, walk: t * 7, dir: 1, shirt: '#2f6fb0', vest: '#f5b942' });
    // cámara de conservación: paneles aislados, evaporadores, escarcha y cortina de tiras
    g.fillStyle = SL.vgrad(g, y - 90, 176, '#1d3a4f', '#122636'); g.fillRect(560, y - 90, 226, 176);
    g.strokeStyle = 'rgba(159,227,255,.12)'; g.lineWidth = 1; for (let x = 590; x < 786; x += 30) { g.beginPath(); g.moveTo(x + 0.5, y - 90); g.lineTo(x + 0.5, y + 86); g.stroke(); }
    g.strokeStyle = '#4fc3f7'; g.lineWidth = 1.5; g.strokeRect(560.5, y - 89.5, 225, 175);
    for (const ex of [600, 720]) { g.fillStyle = SL.metal(g, y - 88, 12, '#c3ccd6'); g.fillRect(ex - 22, y - 88, 44, 12); SL.fan(g, ex - 10, y - 82, 4.5, true, 1.4); SL.fan(g, ex + 10, y - 82, 4.5, true, 1.4); g.fillStyle = 'rgba(230,245,255,.5)'; g.fillRect(ex - 22, y - 77, 44, 1.5); }
    SL.hot('cam', 560, y - 90, 226, 176);
    SL.tag(g, `CÁMARA · ${s.n} pallets`, 673, y - 102, SL.STATE.info);
    for (let i = 0; i < Math.min(s.n, 30); i++) pallet(570 + (i % 6) * 36, y + 42 - Math.floor(i / 6) * 32, 2, 30);
    g.fillStyle = 'rgba(8,12,18,.85)'; SL.rr(g, 742, y - 72, 38, 14, 3); g.fill(); SL.text(g, '2.0 °C', 761, y - 62, '#9fe3ff', '600 9px ui-monospace, monospace', 'center');
    for (let k = 0; k < 7; k++) { g.fillStyle = `rgba(200,230,255,${0.16 + 0.05 * (k % 2)})`; g.fillRect(556 + k * 1.3, fy - 62 + (k % 2), 1.2, 60); } // cortina de tiras PVC
    for (let k = 0; k < 4; k++) { const ph = (t * 0.5 + k / 4) % 1; g.fillStyle = `rgba(220,240,255,${0.25 * (1 - ph)})`; g.beginPath(); g.arc(556 - ph * 22, fy - 4 - (k % 2) * 4, 3 + ph * 5, 0, 7); g.fill(); } // aire frío que escapa por abajo
    SL.bollard(g, 548, fy + 2, 18); SL.bollard(g, 466, fy + 2, 18);
    const dn = (i) => (s.srv[i] && s.srv[i].down) || (i === 0 && s.fk);
    if (hoy) {
      for (let i = 0; i < nsrv; i++) { const k = s.srv[i], busy = !!(k && k.o), f = busy ? SL.clamp(1 - k.rem / 3, 0, 1) : 0, yy = i < 2 ? fy - 30 + i * 30 : fy - 60 - (i - 2) * 30;
        SL.forklift(g, 470 + f * 70, yy, { s: 1.1, load: busy ? col(k.o.T) : null, dist: f * 70 + (k ? k.mv * 140 : 0) }); SL.hot('srv:' + i, 450 + f * 70, yy - 32, 44, 34);
        if (dn(i)) { SL.tag(g, 'AVERÍA', 480 + f * 70, yy - 38, SL.STATE.down, '600 9px system-ui'); SL.cone(g, 456 + f * 70, yy + 1, 0.8); } }
    } else {
      SL.belt(g, [[462, y], [560, y]], 20, null, dn(0) ? 0 : 1.2);
      const k = s.srv[0]; if (k && k.o) pallet(470 + SL.clamp(1 - k.rem / 1.2, 0, 1) * 60, y - 34, k.o.T, 30);
      for (let i = 0; i < nsrv; i++) { const kk = s.srv[i]; SL.person(g, 476 + i * 20, fy, { dir: 1, busy: !!(kk && kk.o) }); SL.hot('srv:' + i, 466 + i * 20, fy - 34, 20, 36); }
      if (dn(0)) SL.tag(g, 'RODILLOS DETENIDOS', 511, y - 22, SL.STATE.down, '600 9px system-ui');
    }
    SL.text(g, `Cola en andén: ${s.q.length} pallets · color de caja = temperatura del pallet`, 140, y + 108, s.q.length > 10 ? '#ef5350' : '#8b9bb0', '12px system-ui');
    const bins = [0, 0, 0, 0, 0, 0]; s.hist.forEach((T) => { bins[SL.clamp(Math.floor(T - 2), 0, 5)]++; });
    const mx = Math.max(1, ...bins);
    g.fillStyle = 'rgba(8,12,18,.6)'; SL.rr(g, 168, 350, 372, 94, 6); g.fill();
    g.strokeStyle = 'rgba(139,155,176,.2)'; g.lineWidth = 1; for (const k of [0.5, 1]) { g.beginPath(); g.moveTo(176, 420.5 - 58 * k); g.lineTo(532, 420.5 - 58 * k); g.stroke(); }
    bins.forEach((v, i) => { const h = (v / mx) * 58; SL.rr(g, 180 + i * 60, 420 - h, 44, Math.max(h, 1), 3); g.fillStyle = SL.color(1 - i / 5); g.fill(); SL.text(g, 2 + i + '°', 202 + i * 60, 436, '#8b9bb0', '11px system-ui', 'center'); if (v) SL.text(g, v, 202 + i * 60, 416 - h, '#c3ccd6', '600 9px system-ui', 'center'); });
    SL.hot('hist', 176, 356, 360, 84);
    SL.text(g, 'Temperatura de ingreso a cámara', 560, 420, '#8b9bb0', '11px system-ui');
    SL.text(g, `Próx. camión ${Math.max(0, s.nextT - (s.t || 0)).toFixed(0)} min · ${p.rule ? 'caliente 1º' : 'FIFO'}`, 560, 384, '#8b9bb0', '11px system-ui');
  },
  heatPos: [14, 12],
  heat: [
    { id: 'tp', label: 'Producto: exceso sobre 2 °C', unit: 'K', max: (s, p) => Math.max(p.rej - 2, p.tamb - 6), fn: (s, p) => {
      const out = s.q.slice(0, 24).map((o, i) => { const [x, y] = qpos(i, 190); return [x + 17, y + 18, o.T - 2, 34]; }), hoy = p.mode === 0;
      if (s.q.length > 24) out.push([420, 268, Math.max(...s.q.slice(24).map((o) => o.T)) - 2, 40]);
      s.srv.forEach((k, i) => { if (!k.o) return; if (hoy) { const f = SL.clamp(1 - k.rem / 3, 0, 1), yy = i < 2 ? 244 + i * 30 : 214 - (i - 2) * 30; out.push([488 + f * 70, yy - 14, k.o.T - 2, 26]); } else out.push([485 + SL.clamp(1 - k.rem / 1.2, 0, 1) * 60, 170, k.o.T - 2, 26]); });
      return out; } },
    { id: 'dwell', label: 'Permanencia fuera de frío', unit: 'min', max: 60, fn: (s) => {
      const out = s.q.slice(0, 24).map((o, i) => { const [x, y] = qpos(i, 190); return [x + 17, y + 18, s.t - o.a, 34]; });
      if (s.q.length > 24) out.push([420, 268, s.t - Math.min(...s.q.slice(24).map((o) => o.a)), 40]);
      return out; } },
    { id: 'cong', label: 'Congestión del andén', unit: 'pallets', max: 8, mode: 'sum', fn: (s) => {
      const out = s.q.slice(0, 24).map((o, i) => { const [x, y] = qpos(i, 190); return [x + 17, y + 18, 1, 70]; });
      if (s.q.length > 24) out.push([420, 268, s.q.length - 24, 70]);
      s.srv.forEach((k) => { if (k.o) out.push([505, 250, 1, 50]); });
      return out; } },
  ],
  vars(s, p) {
    const hoy = p.mode === 0, nq = s.q.length, mT = nq ? s.q.reduce((a, o) => a + o.T, 0) / nq : 0, xT = nq ? Math.max(...s.q.map((o) => o.T)) : 0;
    const hrs = Math.max(s.t, 1) / 60, util = s.capT ? s.busyT / s.capT : 0, nsrv = (hoy ? 2 : 1) + p.extra, act = [...Array(nsrv).keys()].filter((i) => !((s.srv[i] && s.srv[i].down) || (i === 0 && s.fk))).length;
    return {
      fis: [
        ['T° aire del andén', s.tdock.toFixed(1), '°C', null, s.tdock > p.lim ? '#f5b942' : '#4fc3f7'],
        ['T° ambiente exterior', p.tamb, '°C'],
        ['Pallets expuestos en andén', nq, 'pallets', Math.min(1, nq / 40), nq > 10 ? '#ef5350' : undefined],
        ['T° media cola', nq ? mT.toFixed(2) : '—', '°C'],
        ['T° máx. cola', nq ? xT.toFixed(2) : '—', '°C', null, xT > p.rej ? '#ef5350' : xT > p.lim ? '#f5b942' : undefined],
        ['Calor absorbido por la cola', s.qpal.toFixed(2), 'kW'],
        ['Producto expuesto', ((nq * MP) / 1000).toFixed(1), 't'],
        ['Carga térmica andén frío', hoy ? '— (sin frío)' : s.qref.toFixed(1), hoy ? '' : 'kW'],
        ['Potencia eléctrica andén', s.pel.toFixed(2), 'kW'],
        ['Energía andén frío', s.kwhD.toFixed(1), 'kWh'],
        ['Energía montacargas', s.kwhF.toFixed(2), 'kWh'],
        ['Recorrido de traslado', s.km.toFixed(2), 'km'],
        ['Throughput a cámara', (s.n / hrs).toFixed(0), 'pallets/h'],
        ['Estancia media en andén', s.n ? (s.sumW / s.n).toFixed(1) : '—', 'min'],
      ],
      ctl: [
        ['Escenario', hoy ? 'Hoy (ambiente)' : 'Propuesto (frío)', ''],
        ['Regla de despacho', RULE[p.rule], ''],
        ['Recursos activos', `${act} / ${nsrv}`, '', act / nsrv, act < nsrv ? '#ef5350' : '#3ecf8e'],
        ['Utilización de recursos', (100 * util).toFixed(0), '%', util],
        ['Tiempo de servicio', ((hoy ? 2.8 : 1.2) * p.dist / 15).toFixed(2), 'min/pallet'],
        ['Capacidad teórica', ((60 * act) / ((hoy ? 2.8 : 1.2) * p.dist / 15)).toFixed(0), 'pallets/h'],
        ['Demanda de llegada', ((60 * p.np) / p.gap).toFixed(0), 'pallets/h'],
        ['Espera del pallet más antiguo', nq ? (s.t - Math.min(...s.q.map((o) => o.a))).toFixed(0) : '0', 'min'],
        ['Pallets en cola > umbral', s.q.filter((o) => o.T > p.lim).length, '', null, s.q.some((o) => o.T > p.lim) ? '#f5b942' : undefined],
        ['Umbral / rechazo', `${p.lim} / ${p.rej}`, '°C'],
        ['Rechazados', s.rej, 'pallets', null, s.rej ? '#ef5350' : undefined],
        ['Alarma cola > 1 camión', s.alQ ? 'ACTIVA' : 'normal', '', null, s.alQ ? '#f5b942' : undefined],
        ['Próximo camión', Math.max(0, s.nextT - s.t).toFixed(0), 'min'],
        ['Frío del andén', hoy ? 'no instalado' : s.blk ? 'CORTE' : 'en servicio', '', null, s.blk && !hoy ? '#ef5350' : undefined],
      ],
    };
  },
  actions: [
    { label: 'Dos camiones juntos', hint: 'Llega un camión extra ahora', kind: 'warn', run: (s, p) => { for (let i = 0; i < p.np; i++) s.q.push({ T: 2, a: s.t, bad: 0, id: s.seq++ }); s.trucks++; } },
    { label: 'Avería montacargas / rodillos', kind: 'crit', on: (s) => s.fk, run: (s) => { s.fk = !s.fk; SL.log(s, s.fk ? 'Recurso 1 averiado (montacargas / rodillos)' : 'Recurso 1 reparado', s.fk ? 'crit' : 'ok'); } },
    { label: 'Corte de frío en andén', hint: 'Solo afecta al escenario propuesto', kind: 'crit', on: (s) => s.blk, run: (s) => { s.blk = !s.blk; SL.log(s, s.blk ? 'Corte del equipo de frío del andén' : 'Frío del andén restablecido', s.blk ? 'crit' : 'ok'); } },
    { label: 'Sumar operario', run: (s, p, r, api) => api.set('extra', Math.min(3, p.extra + 1)) },
    { label: 'Quitar operario', run: (s, p, r, api) => api.set('extra', Math.max(0, p.extra - 1)) },
    { label: 'Priorizar calientes', on: (s, p) => p.rule === 1, run: (s, p, r, api) => { api.set('rule', p.rule ? 0 : 1); SL.log(s, p.rule ? 'Despacho: más caliente primero' : 'Despacho: FIFO', 'info'); } },
  ],
  inspect(s, p, id) {
    const hoy = p.mode === 0, v = () => this.vars(s, p);
    if (id.startsWith('pal:')) { const pid = +id.split(':')[1], qi = s.q.findIndex((o) => o.id === pid), sv = s.srv.find((k) => k.o && k.o.id === pid), o = qi >= 0 ? s.q[qi] : sv && sv.o;
      if (!o) return { title: `Pallet #${pid + 1}`, sub: 'Ya ingresó a cámara', fis: [], ctl: [] };
      return { title: `Pallet #${pid + 1}`, sub: `${MP} kg · se calienta hacia ${s.tdock.toFixed(1)} °C con τ = 120 min`,
        fis: [['T° producto', o.T.toFixed(2), '°C', SL.clamp((o.T - 2) / (p.rej - 2), 0, 1), o.T > p.rej ? '#ef5350' : o.T > p.lim ? '#f5b942' : '#3ecf8e'], ['Tasa de calentamiento', (60 * (s.tdock - o.T) / 120).toFixed(2), '°C/h'], ['Calor absorbido', (MP * CPP * (o.T - 2) / 1000).toFixed(0), 'MJ'], ['Tiempo en andén', (s.t - o.a).toFixed(0), 'min'], ['Min sobre umbral', o.bad.toFixed(0), 'min']],
        ctl: [['Estado', sv ? 'EN TRASLADO' : 'EN COLA', ''], ['Posición en cola', qi >= 0 ? qi + 1 : '—', ''], ['Llega a rechazo en', o.T < p.rej && s.tdock > p.rej ? (-120 * Math.log((s.tdock - p.rej) / (s.tdock - o.T))).toFixed(0) : o.T >= p.rej ? 'YA' : 'nunca', o.T < p.rej && s.tdock > p.rej ? 'min' : '']],
        actions: qi > 0 ? [{ label: 'Priorizar', run: (s) => { const j = s.q.findIndex((x) => x.id === pid); if (j > 0) s.q.unshift(s.q.splice(j, 1)[0]); } }] : [] }; }
    if (id.startsWith('srv:')) { const i = +id.split(':')[1], k = s.srv[i] || { o: null, rem: 0, down: false, mv: 0 }, dn = k.down || (i === 0 && s.fk);
      return { title: hoy ? `Montacargas ${i + 1}` : `Operario ${i + 1} · línea de rodillos`, sub: `Traslado de ${p.dist} m · ${((hoy ? 2.8 : 1.2) * p.dist / 15).toFixed(1)} min/pallet`,
        fis: [['Pallets movidos', k.mv, ''], ['Recorrido', ((k.mv * 2 * p.dist) / 1000).toFixed(2), 'km'], hoy ? ['Energía batería', (k.mv * EFK * p.dist / 15).toFixed(2), 'kWh'] : ['Velocidad de rodillos', (p.dist / (1.2 * p.dist / 15 * 60)).toFixed(2), 'm/s'], ['Carga', k.o ? `pallet #${k.o.id + 1} · ${k.o.T.toFixed(1)} °C` : 'vacío', '']],
        ctl: [['Estado', dn ? 'AVERÍA' : k.o ? 'TRASLADANDO' : 'LIBRE', '', null, dn ? '#ef5350' : k.o ? '#3ecf8e' : '#8b9bb0'], ['Resta', k.o ? Math.max(0, k.rem).toFixed(1) : '—', 'min']],
        actions: [{ label: dn ? 'Reparar' : 'Forzar avería', run: (s) => { const kk = s.srv[i] || (s.srv[i] = { o: null, rem: 0, down: false, mv: 0 }); if (i === 0 && s.fk) s.fk = false; else kk.down = !kk.down; } }] }; }
    if (id === 'truck') return { title: 'Camión refrigerado en descarga', sub: `${p.np} pallets cada ${p.gap} min`, fis: [['Camiones recibidos', s.trucks, ''], ['Pallets recibidos', s.seq, '']], ctl: [['Próximo camión', Math.max(0, s.nextT - s.t).toFixed(0), 'min'], ['Demanda', ((60 * p.np) / p.gap).toFixed(0), 'pallets/h']],
      actions: [{ label: 'Adelantar camión', run: (s) => { s.nextT = s.t; } }] };
    if (id === 'dock') return { title: hoy ? 'Andén ambiente' : 'Andén refrigerado', sub: hoy ? 'Sin frío: el aire del andén sigue al exterior (−4 °C)' : `UA ${UA} kW/K · COP ${COPD}`, fis: v().fis.slice(0, 10), ctl: v().ctl.slice(7, 12),
      actions: hoy ? [] : [{ label: s.blk ? 'Restablecer frío' : 'Cortar frío', run: (s) => { s.blk = !s.blk; } }] };
    if (id === 'cam') return { title: 'Cámara de conservación', sub: 'Pallets ingresados y su temperatura de ingreso',
      fis: [['Pallets en cámara', s.n, ''], ['T° media de ingreso', (s.sumPk / Math.max(s.n, 1)).toFixed(2), '°C'], ['Producto', ((s.n * MP) / 1000).toFixed(1), 't'], ['Calor a extraer (ingreso − 2 °C)', ((MP * CPP * (s.sumPk - 2 * s.n)) / 3600 / 1000).toFixed(2), 'MWh']],
      ctl: [['Rechazados', s.rej, ''], ['% rechazo', ((100 * s.rej) / Math.max(s.n, 1)).toFixed(1), '%']] };
    if (id === 'hist') return { title: 'Histograma de T° de ingreso', sub: 'Pallets por grado de temperatura al entrar a cámara', fis: [['Pallets medidos', s.hist.length, ''], ['T° media', (s.sumPk / Math.max(s.n, 1)).toFixed(2), '°C']], ctl: [['Umbral', p.lim, '°C'], ['Rechazo', p.rej, '°C']] };
  },
  kpis(s, p) {
    const hrs = Math.max(s.t, 1) / 60;
    return [
      { label: 'Pallets a cámara/h', value: (s.n / hrs).toFixed(0) },
      { label: 'Temp. media al ingreso', value: (s.sumPk / Math.max(s.n, 1)).toFixed(1) + ' °C' },
      { label: 'Minutos pallet sobre umbral', value: s.bad.toFixed(0) + ' min' },
      { label: 'Pallets rechazados', value: s.rej + ' (' + ((100 * s.rej) / Math.max(s.n, 1)).toFixed(0) + ' %)' },
      { label: 'Cola en andén', value: s.q.length },
      { label: 'Personas en andén', value: (p.mode === 0 ? 2 : 1) + p.extra },
      { label: 'Energía andén + montacargas', value: (s.kwhD + s.kwhF).toFixed(1) + ' kWh' },
    ];
  },
  series: (s) => ({ 'Cola andén': s.q.length, 'Rechazados': s.rej, 'Min sobre umbral': s.bad, 'T° andén': s.tdock }),
});
</script></body></html>
