<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../shared/style.css"></head>
<body><div id="app"></div>
<script src="../../shared/controls.js"></script>
<script src="../../shared/sim.js"></script>
<script src="../../shared/gfx.js"></script>
<script>
// Andén / cross-dock con frío: pallets que esperan expuestos entre camión y cámara. Unidad: minutos.
SL.app({
  title: 'Cadena de frío · Andén y cross-dock refrigerado',
  desc: 'Cada camión llega con pallets que quedan expuestos al ambiente del andén hasta que un operario los mueve a cámara. La cola en andén es cadena de frío rota.',
  pitch: '"La cadena de frío se rompe en los 15 metros entre el camión y la cámara."',
  obj: '"Un andén refrigerado es muy caro." → Compara reclamos y pallets rechazados contra el costo de mercadería dañada.',
  unit: 'min', dt: 0.1, sample: 5, speeds: [1, 10, 60, 240],
  params: [
    { id: 'mode', label: 'Escenario', opts: ['Hoy: andén ambiente + 2 montacargas', 'Propuesto: andén frío + rodillos'], value: 0 },
    { id: 'np', label: 'Pallets por camión', min: 8, max: 40, step: 2, value: 20 },
    { id: 'gap', label: 'Un camión cada', min: 15, max: 90, step: 5, value: 35, unit: 'min' },
    { id: 'tamb', label: 'Ambiente exterior', min: 15, max: 40, step: 1, value: 28, unit: '°C' },
    { id: 'lim', label: 'Umbral de pallet', min: 3, max: 8, step: 0.5, value: 5, unit: '°C' },
    { id: 'rej', label: 'Rechazo si supera', min: 6, max: 12, step: 0.5, value: 8, unit: '°C' },
  ],
  init() { return { q: [], srv: [], sv: 0, n: 0, bad: 0, rej: 0, sumPk: 0, nextT: 0, expo: 0, hist: [] }; },
  step(s, dt, p, r) {
    const hoy = p.mode === 0, nsrv = hoy ? 2 : 1, svc = hoy ? 2.8 : 1.2, tdock = hoy ? p.tamb - 4 : 8, tau = 120;
    if (s.t >= s.nextT) { for (let i = 0; i < p.np; i++) s.q.push({ T: 2, a: s.t, bad: 0 }); s.nextT += p.gap; }
    const exp = (o) => { o.T += dt * (tdock - o.T) / tau; if (o.T > p.lim) o.bad += dt; };
    s.q.forEach(exp);
    for (let i = 0; i < nsrv; i++) {
      const k = s.srv[i] || (s.srv[i] = { o: null, rem: 0 });
      if (k.o) { exp(k.o); if ((k.rem -= dt) <= 0) { const o = k.o; k.o = null; s.n++; s.sumPk += o.T; s.bad += o.bad; if (o.T > p.rej) s.rej++; s.hist.push(o.T); } }
      if (!k.o && s.q.length) { k.o = s.q.shift(); k.rem = svc * (0.85 + 0.3 * r()); }
    }
  },
  draw(g, s, p, W, H) {
    const hoy = p.mode === 0, y = 190, fy = y + 84;
    SL.van(g, 104, fy, { s: 1.5, dir: -1, open: true, reefer: true, body: '#e8eef5', cab: '#1f6f8b' });
    g.fillStyle = hoy ? 'rgba(245,185,66,.06)' : 'rgba(79,195,247,.08)'; g.fillRect(132, y - 90, 330, 176);
    g.strokeStyle = hoy ? 'rgba(245,185,66,.5)' : 'rgba(79,195,247,.6)'; g.setLineDash([6, 4]); g.strokeRect(132.5, y - 89.5, 329, 175); g.setLineDash([]);
    SL.tag(g, hoy ? `ANDÉN AMBIENTE ${p.tamb - 4} °C` : 'ANDÉN REFRIGERADO 8 °C', 297, y - 102, hoy ? SL.STATE.warn : SL.STATE.info);
    const col = (T) => SL.color(1 - SL.clamp((T - 2) / (p.rej - 2), 0, 1));
    const pallet = (x, yy, T, w = 32) => { SL.pallet(g, x, yy + 26, w); for (let r = 0; r < 2; r++) for (let k = 0; k < 2; k++) SL.carton(g, x + 1 + k * (w / 2 - 0.5), yy + 2 + r * 12, w / 2 - 1, 12, col(T)); };
    s.q.slice(0, 24).forEach((o, i) => pallet(142 + (i % 8) * 39, y - 70 + Math.floor(i / 8) * 50, o.T));
    if (s.q.length > 24) SL.tag(g, `+${s.q.length - 24} pallets`, 420, y + 78, SL.STATE.down);
    g.fillStyle = SL.vgrad(g, y - 90, 176, '#1d3a4f', '#122636'); g.fillRect(560, y - 90, 226, 176); g.strokeStyle = '#4fc3f7'; g.lineWidth = 1.5; g.strokeRect(560.5, y - 89.5, 225, 175);
    SL.tag(g, `CÁMARA · ${s.n} pallets`, 673, y - 102, SL.STATE.info);
    for (let i = 0; i < Math.min(s.n, 30); i++) pallet(570 + (i % 6) * 36, y + 42 - Math.floor(i / 6) * 32, 2, 30);
    if (hoy) {
      [0, 1].forEach((i) => { const k = s.srv[i], busy = !!(k && k.o), f = busy ? SL.clamp(1 - k.rem / 3, 0, 1) : 0; SL.forklift(g, 470 + f * 70, fy - 30 + i * 30, { s: 1.1, load: busy ? col(k.o.T) : null }); });
    } else {
      SL.belt(g, [[462, y], [560, y]], 20);
      const k = s.srv[0]; if (k && k.o) pallet(470 + SL.clamp(1 - k.rem / 1.2, 0, 1) * 60, y - 34, k.o.T, 30);
      SL.person(g, 476, fy, { dir: 1, busy: !!(k && k.o) });
    }
    SL.text(g, `Cola en andén: ${s.q.length} pallets · color de caja = temperatura del pallet`, 140, y + 108, s.q.length > 10 ? '#ef5350' : '#8b9bb0', '12px system-ui');
    const bins = [0, 0, 0, 0, 0, 0]; s.hist.forEach((T) => { bins[SL.clamp(Math.floor(T - 2), 0, 5)]++; });
    const mx = Math.max(1, ...bins);
    bins.forEach((v, i) => { const h = (v / mx) * 58; SL.rr(g, 180 + i * 60, 420 - h, 44, Math.max(h, 1), 3); g.fillStyle = SL.color(1 - i / 5); g.fill(); SL.text(g, 2 + i + '°', 202 + i * 60, 436, '#8b9bb0', '11px system-ui', 'center'); });
    SL.text(g, 'Temperatura de ingreso a cámara', 560, 420, '#8b9bb0', '11px system-ui');
  },
  kpis(s, p) {
    const hrs = Math.max(s.t, 1) / 60;
    return [
      { label: 'Pallets a cámara/h', value: (s.n / hrs).toFixed(0) },
      { label: 'Temp. media al ingreso', value: (s.sumPk / Math.max(s.n, 1)).toFixed(1) + ' °C' },
      { label: 'Minutos pallet sobre umbral', value: s.bad.toFixed(0) + ' min' },
      { label: 'Pallets rechazados', value: s.rej + ' (' + ((100 * s.rej) / Math.max(s.n, 1)).toFixed(0) + ' %)' },
      { label: 'Cola en andén', value: s.q.length },
      { label: 'Personas en andén', value: p.mode === 0 ? 2 : 1 },
    ];
  },
  series: (s) => ({ 'Cola andén': s.q.length, 'Rechazados': s.rej, 'Min sobre umbral': s.bad }),
});
</script></body></html>
