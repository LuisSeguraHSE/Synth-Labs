<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../shared/style.css"></head>
<body><div id="app"></div>
<script src="../../shared/controls.js"></script>
<script src="../../shared/sim.js"></script>
<script src="../../shared/gfx.js"></script>
<script>
// Línea serie de 3 estaciones con buffers finitos, fallas y reparaciones. Unidad: segundos.
const NAMES = ['Corte', 'Ensamble', 'Empaque'];
SL.app({
  title: 'Manufactura · Línea de producción',
  desc: 'Serie de 3 estaciones con buffers finitos. Observa bloqueos/inanición, el cuello de botella y el efecto del buffer y las fallas.',
  unit: 's', dt: 0.1, sample: 10,
  params: [
    { id: 'c0', label: 'Ciclo Corte', min: 4, max: 30, step: 1, value: 10, unit: 's' },
    { id: 'c1', label: 'Ciclo Ensamble', min: 4, max: 30, step: 1, value: 13, unit: 's' },
    { id: 'c2', label: 'Ciclo Empaque', min: 4, max: 30, step: 1, value: 9, unit: 's' },
    { id: 'buf', label: 'Capacidad de buffer', min: 1, max: 20, step: 1, value: 4, unit: 'pzas' },
    { id: 'mtbf', label: 'MTBF (tiempo entre fallas)', min: 30, max: 600, step: 10, value: 200, unit: 's' },
    { id: 'mttr', label: 'MTTR (reparación)', min: 5, max: 120, step: 5, value: 25, unit: 's' },
  ],
  init() {
    return { out: 0, buf: [0, 0], st: [0, 1, 2].map(() => ({ s: 'idle', rem: 0, work: 0, down: 0, block: 0, starve: 0 })) };
  },
  step(s, dt, p, r) {
    const cyc = [p.c0, p.c1, p.c2];
    s.st.forEach((k, i) => {
      if (k.s === 'down') { k.down += dt; if ((k.rem -= dt) <= 0) k.s = 'work'; return; }
      if (k.s === 'idle') {
        if (i === 0 || s.buf[i - 1] > 0) { if (i) s.buf[i - 1]--; k.s = 'work'; k.rem = cyc[i] * (0.8 + 0.4 * r()); }
        else { k.starve += dt; return; }
      }
      if (k.s === 'work') {
        k.work += dt;
        if (r() < dt / p.mtbf) { k.s = 'down'; k.rem = SL.exp(r, p.mttr); return; }
        if ((k.rem -= dt) <= 0) k.s = 'done';
      }
      if (k.s === 'done') {
        if (i === 2) { s.out++; k.s = 'idle'; }
        else if (s.buf[i] < p.buf) { s.buf[i]++; k.s = 'idle'; }
        else k.block += dt;
      }
    });
  },
  draw(g, s, p, W, H) {
    const map = { idle: 'idle', work: 'run', done: 'block', down: 'down' }, y = 140, mw = 132, gap = 110, fy = y + 128;
    g.fillStyle = 'rgba(255,255,255,.05)'; g.fillRect(10, fy, 780, 2);
    SL.belt(g, [[16, y + 74], [690, y + 74]], 14);
    s.st.forEach((k, i) => {
      const x = 30 + i * (mw + gap);
      const txt = k.s === 'idle' ? (i ? 'Inanición' : 'Libre') : k.s === 'work' ? 'Produciendo' : k.s === 'done' ? 'Bloqueada' : 'FALLA';
      SL.machine(g, x, y, mw, 100, { label: NAMES[i], sub: txt, state: map[k.s], tag: txt, load: k.s === 'work' ? 0.9 : 0.2 });
      SL.person(g, x + 26, fy, { dir: 1, busy: k.s === 'work' });
      if (k.s === 'down') { SL.person(g, x + mw - 18, fy, { dir: -1, busy: true, helmet: '#f5b942', shirt: '#6b4fa0' }); SL.tag(g, 'MANTENIMIENTO', x + mw / 2, fy + 16, SL.STATE.setup); }
      if (i < 2) {
        const bx = x + mw + 6, n = Math.min(p.buf, 12), step = (gap - 12) / Math.max(n, 1), cw = Math.min(step - 2, 14);
        for (let j = 0; j < n; j++) { const cx = bx + j * step; if (j < s.buf[i]) SL.carton(g, cx, y + 60, cw, 12, '#b98a58'); else { g.strokeStyle = 'rgba(139,155,176,.35)'; g.strokeRect(cx + 0.5, y + 60.5, cw - 1, 11); } }
        SL.tag(g, `Buffer ${s.buf[i]}/${p.buf}`, x + mw + gap / 2, y + 38, SL.STATE.info);
      }
    });
    // Salida: pallet con producto terminado
    const ox = 700, n = s.out % 30;
    SL.pallet(g, ox, fy - 7, 80);
    for (let j = 0; j < n; j++) SL.carton(g, ox + 2 + (j % 5) * 15.2, fy - 7 - 12 - Math.floor(j / 5) * 12, 15, 12, '#c9a06a');
    SL.tag(g, `Salida: ${s.out} piezas`, ox + 40, y - 20, SL.STATE.run);
  },
  kpis(s, p) {
    const T = Math.max(s.t, 1), u = s.st.map((k) => k.work / T);
    const bn = u.indexOf(Math.max(...u));
    const theo = 3600 / Math.max(p.c0, p.c1, p.c2);
    return [
      { label: 'Piezas', value: s.out },
      { label: 'Throughput', value: ((3600 * s.out) / T).toFixed(0) + ' pzas/h' },
      { label: 'Teórico (sin fallas)', value: theo.toFixed(0) + ' pzas/h' },
      { label: 'Eficiencia vs teórico', value: ((100 * ((3600 * s.out) / T)) / theo).toFixed(0) + ' %' },
      ...s.st.map((k, i) => ({ label: `Util. ${NAMES[i]}`, value: (100 * u[i]).toFixed(0) + ' %' })),
      { label: 'Cuello de botella', value: NAMES[bn] },
    ];
  },
  series: (s) => ({ 'Salida acum.': s.out, 'Buffer 1': s.buf[0], 'Buffer 2': s.buf[1], 'WIP total': s.buf[0] + s.buf[1] }),
});
</script></body></html>
